<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资产管理系统 (Net Worth Dashboard)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- 顶部导航与总览栏 -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500/10 text-emerald-400 p-2.5 rounded-xl border border-emerald-500/20">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">个人净资产全景看板</h1>
                    <p class="text-xs text-slate-400">独立按键防错架构 · 绝对防负数 · 防清零保护</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="loadAppData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> 刷新数据
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- 总资产概览卡片 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="text-xs text-slate-400 font-medium">总净资产 (Net Worth)</div>
                <div id="summary-nw" class="text-2xl font-bold text-emerald-400 mt-1">RM 0.00</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="text-xs text-slate-400 font-medium">现金存款 (Cash)</div>
                <div id="summary-cash" class="text-xl font-semibold text-slate-100 mt-1">RM 0.00</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="text-xs text-slate-400 font-medium">黄金资产 (Gold)</div>
                <div id="summary-gold" class="text-xl font-semibold text-slate-100 mt-1">RM 0.00</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="text-xs text-slate-400 font-medium">股票市值 (Stocks)</div>
                <div id="summary-stocks" class="text-xl font-semibold text-slate-100 mt-1">RM 0.00</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <div class="text-xs text-slate-400 font-medium">公积金 (EPF)</div>
                <div id="summary-epf" class="text-xl font-semibold text-slate-100 mt-1">RM 0.00</div>
            </div>
        </div>

        <!-- 资产明细模块标签区 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- 1. 公积金 (EPF) 模块 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h2 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-shield-halved text-amber-400"></i> 公积金资产 (EPF / KWSP)</h2>
                    <button onclick="openAddEPFAccountModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                        <i class="fa-solid fa-plus"></i> 新增账户
                    </button>
                </div>
                <div id="epf-accounts-container" class="space-y-3">
                    <div class="text-slate-500 text-sm text-center py-4">加载中...</div>
                </div>
            </div>

            <!-- 2. 现金存款 (Cash) 模块 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h2 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-wallet text-blue-400"></i> 现金与存款账户 (Cash)</h2>
                    <button onclick="openAddCashAccountModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                        <i class="fa-solid fa-plus"></i> 新增账户
                    </button>
                </div>
                <div id="cash-accounts-container" class="space-y-3">
                    <div class="text-slate-500 text-sm text-center py-4">加载中...</div>
                </div>
            </div>

            <!-- 3. 黄金 (Gold) 模块 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h2 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-coins text-yellow-400"></i> 黄金资产 (Gold)</h2>
                </div>
                <div id="gold-container" class="space-y-3">
                    <div class="text-slate-500 text-sm text-center py-4">加载中...</div>
                </div>
            </div>

            <!-- 4. 股票 (Stocks) 模块 -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h2 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-arrow-trend-up text-emerald-400"></i> 股票持仓 (Stocks)</h2>
                    <button onclick="openAddStockModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">
                        <i class="fa-solid fa-plus"></i> 新增股票
                    </button>
                </div>
                <div id="stocks-container" class="space-y-3">
                    <div class="text-slate-500 text-sm text-center py-4">加载中...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- 通用弹窗 -->
    <div id="app-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="modal-content" class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <!-- 动态注入内容 -->
        </div>
    </div>

    <!-- 完整前端控制逻辑脚本 -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyN6-GP-VIklUctbZ3963WRpCaiSeG70xEKGHHRBwceh2kRI6saLa5NPaWsMYX8N9T0/exec";

        let globalData = {};

        window.onload = function() {
            loadAppData();
        };

        function loadAppData() {
            const icon = document.getElementById('refresh-icon');
            if(icon) icon.classList.add('fa-spin');

            fetch(API_URL + "?action=getOverview")
                .then(res => res.json())
                .then(data => {
                    globalData = data;
                    renderDashboard(data);
                    if(icon) icon.classList.remove('fa-spin');
                })
                .catch(err => {
                    console.error("加载失败:", err);
                    alert("无法连接到后端，请检查 API URL。");
                    if(icon) icon.classList.remove('fa-spin');
                });
        }

        function renderDashboard(data) {
            // 1. 渲染 EPF 公积金
            let epfHtml = '';
            let totalEpfVal = 0;
            if (data.epfData && data.epfData.length > 0) {
                data.epfData.forEach(acc => {
                    let key = acc.Account_Key || acc.accountKey;
                    let cat = acc.Category || acc.category;
                    let name = acc.Fund_Name || acc.fundName;
                    let bal = parseFloat(acc.Current_Balance || acc.balance || 0);
                    totalEpfVal += bal;

                    epfHtml += `
                        <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-xl flex flex-col gap-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="text-xs text-amber-400 font-semibold">${cat || ''}</div>
                                    <div class="font-bold text-base text-slate-100">${name || ''}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-slate-400">当前余额</div>
                                    <div class="text-lg font-bold text-emerald-400">RM ${bal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 pt-2 border-t border-slate-900">
                                <button onclick="openEPFTxnModal('Deposit', '${key}', '${name}', ${bal})" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white py-1.5 rounded-lg text-xs font-semibold transition border border-emerald-500/30">
                                    ➕ 账户供款
                                </button>
                                <button onclick="openEPFTxnModal('Withdrawal', '${key}', '${name}', ${bal})" class="flex-1 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white py-1.5 rounded-lg text-xs font-semibold transition border border-red-500/30">
                                    ➖ 账户提款
                                </button>
                                <button onclick="openEPFHistoryModal('${key}', '${name}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                    明细
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                epfHtml = '<div class="text-slate-500 text-sm text-center py-4">暂无公积金账户</div>';
            }
            document.getElementById('epf-accounts-container').innerHTML = epfHtml;
            document.getElementById('summary-epf').innerText = 'RM ' + totalEpfVal.toLocaleString('en-US', {minimumFractionDigits: 2});

            // 2. 渲染 Cash 存款
            let cashHtml = '';
            let totalCashVal = 0;
            if (data.cashAccounts && data.cashAccounts.length > 0) {
                data.cashAccounts.forEach(acc => {
                    let id = acc.Account_ID || acc.accountId;
                    let type = acc.Type || acc.type;
                    let bank = acc.Bank_Name || acc.bankName;
                    let nick = acc.Nickname || acc.nickname;
                    let bal = parseFloat(acc.Balance || acc.balance || 0);
                    totalCashVal += bal;

                    cashHtml += `
                        <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-xl flex flex-col gap-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="text-xs text-blue-400 font-semibold">${type || ''} - ${bank || ''}</div>
                                    <div class="font-bold text-base text-slate-100">${nick || ''}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-slate-400">可用余额</div>
                                    <div class="text-lg font-bold text-emerald-400">RM ${bal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 pt-2 border-t border-slate-900">
                                <button onclick="openCashTxnModal('Deposit', '${id}', '${nick}', ${bal})" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white py-1.5 rounded-lg text-xs font-semibold transition border border-emerald-500/30">
                                    ➕ 存入
                                </button>
                                <button onclick="openCashTxnModal('Withdrawal', '${id}', '${nick}', ${bal})" class="flex-1 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white py-1.5 rounded-lg text-xs font-semibold transition border border-red-500/30">
                                    ➖ 提取支出
                                </button>
                                <button onclick="openCashHistoryModal('${id}', '${nick}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                    明细
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                cashHtml = '<div class="text-slate-500 text-sm text-center py-4">暂无存款账户</div>';
            }
            document.getElementById('cash-accounts-container').innerHTML = cashHtml;
            document.getElementById('summary-cash').innerText = 'RM ' + totalCashVal.toLocaleString('en-US', {minimumFractionDigits: 2});

            // 3. 渲染 Gold 黄金
            let goldHtml = '';
            let totalGoldVal = 0;
            if (data.goldList && data.goldList.length > 0) {
                data.goldList.forEach(g => {
                    let gType = g.Gold_Type || g.goldType;
                    let grams = parseFloat(g.Total_Grams || g.grams || 0);
                    let mVal = parseFloat(g.Market_Value || g.marketValue || 0);
                    totalGoldVal += mVal;

                    goldHtml += `
                        <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-xl flex flex-col gap-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="text-xs text-yellow-400 font-semibold">黄金类型</div>
                                    <div class="font-bold text-base text-slate-100">${gType || ''}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-slate-400">克数: ${grams.toFixed(2)} g</div>
                                    <div class="text-lg font-bold text-emerald-400">RM ${mVal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 pt-2 border-t border-slate-900">
                                <button onclick="openGoldTxnModal('buy', '${gType}')" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white py-1.5 rounded-lg text-xs font-semibold transition border border-emerald-500/30">
                                    ➕ 买入黄金
                                </button>
                                <button onclick="openGoldTxnModal('sell', '${gType}')" class="flex-1 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white py-1.5 rounded-lg text-xs font-semibold transition border border-red-500/30">
                                    ➖ 卖出黄金
                                </button>
                            </div>
                        </div>
                    `;
                });
            } else {
                goldHtml = '<div class="text-slate-500 text-sm text-center py-4">暂无黄金持仓</div>';
            }
            document.getElementById('gold-container').innerHTML = goldHtml;
            document.getElementById('summary-gold').innerText = 'RM ' + totalGoldVal.toLocaleString('en-US', {minimumFractionDigits: 2});

            // 4. 渲染 Stocks 股票
            let stocksHtml = '';
            let totalStockVal = 0;
            if (data.stockData && data.stockData.length > 0) {
                data.stockData.forEach(st => {
                    let ticker = st.Ticker || st.ticker;
                    let name = st.Stock_Name || st.stockName;
                    let shares = parseFloat(st.Total_Shares || st.shares || 0);
                    let curPrice = parseFloat(st.Current_Price || st.currentPrice || 0);
                    let mVal = shares * curPrice;
                    totalStockVal += mVal;

                    stocksHtml += `
                        <div class="bg-slate-950/50 border border-slate-800/80 p-4 rounded-xl flex flex-col gap-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="text-xs text-emerald-400 font-semibold">${ticker || ''}</div>
                                    <div class="font-bold text-sm text-slate-100">${name || ''}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xs text-slate-400">持有: ${shares} 股</div>
                                    <div class="text-base font-bold text-emerald-400">RM ${mVal.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 pt-2 border-t border-slate-900">
                                <button onclick="openStockTxnModal('Buy', '${ticker}')" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white py-1 rounded text-xs">➕ 买入</button>
                                <button onclick="openStockTxnModal('Sell', '${ticker}')" class="flex-1 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white py-1 rounded text-xs">➖ 卖出</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                stocksHtml = '<div class="text-slate-500 text-sm text-center py-4">暂无股票持仓</div>';
            }
            document.getElementById('stocks-container').innerHTML = stocksHtml;
            document.getElementById('summary-stocks').innerText = 'RM ' + totalStockVal.toLocaleString('en-US', {minimumFractionDigits: 2});

            // 总净资产
            let totalNw = totalEpfVal + totalCashVal + totalGoldVal + totalStockVal;
            document.getElementById('summary-nw').innerText = 'RM ' + totalNw.toLocaleString('en-US', {minimumFractionDigits: 2});
        }

        // ================= 弹窗与交互函数 =================
        function openEPFTxnModal(type, accountKey, fundName, currentBal) {
            let isDep = (type === 'Deposit');
            let title = isDep ? '账户供款 (Deposit)' : '账户提款 (Withdrawal)';
            let btnClass = isDep ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-red-600 hover:bg-red-500';

            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">${fundName} - ${title}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400">金额 (RM)</label>
                        <input type="number" id="epf-amount" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">日期</label>
                        <input type="date" id="epf-date" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" value="${new Date().toISOString().split('T')[0]}">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">备注 (Remark)</label>
                        <input type="text" id="epf-remark" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="例如：每月正常供款">
                    </div>
                    <button id="submit-btn" onclick="submitEPFTxn('${accountKey}', '${type}', ${currentBal})" class="w-full ${btnClass} text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
                        确认提交
                    </button>
                </div>
            `);
        }

        function submitEPFTxn(accountKey, type, currentBal) {
            let amt = parseFloat(document.getElementById('epf-amount').value);
            let date = document.getElementById('epf-date').value;
            let remark = document.getElementById('epf-remark').value;

            if (!amt || amt <= 0) { alert('请输入有效金额！'); return; }
            if (type === 'Withdrawal' && amt > currentBal) { alert('提取金额不能大于当前可用余额！'); return; }

            let btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = '提交中...';

            sendApi({ action: 'addEPFTransaction', accountKey: accountKey, type: type, amount: amt, date: date, remark: remark.trim() });
        }

        function openCashTxnModal(type, accountId, nick, currentBal) {
            let isDep = (type === 'Deposit');
            let title = isDep ? '存入现金 (Deposit)' : '提取支出 (Withdrawal)';
            let btnClass = isDep ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-red-600 hover:bg-red-500';

            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">${nick} - ${title}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400">金额 (RM)</label>
                        <input type="number" id="cash-amount" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">日期</label>
                        <input type="date" id="cash-date" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" value="${new Date().toISOString().split('T')[0]}">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">备注 (Remark)</label>
                        <input type="text" id="cash-remark" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="例如：薪水入账">
                    </div>
                    <button id="submit-btn" onclick="submitCashTxn('${accountId}', '${type}', ${currentBal})" class="w-full ${btnClass} text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
                        确认提交
                    </button>
                </div>
            `);
        }

        function submitCashTxn(accountId, type, currentBal) {
            let amt = parseFloat(document.getElementById('cash-amount').value);
            let date = document.getElementById('cash-date').value;
            let remark = document.getElementById('cash-remark').value;

            if (!amt || amt <= 0) { alert('请输入有效金额！'); return; }
            if (type === 'Withdrawal' && amt > currentBal) { alert('提取金额不能大于当前可用余额！'); return; }

            let btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = '提交中...';

            sendApi({ action: 'updateCashBalance', accountId: accountId, type: type === 'Deposit' ? 'in' : 'out', amount: amt, date: date, remark: remark.trim() });
        }

        function openGoldTxnModal(txnType, goldType) {
            let isBuy = (txnType === 'buy');
            let title = isBuy ? '买入黄金 (Buy)' : '卖出黄金 (Sell)';
            let btnClass = isBuy ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-red-600 hover:bg-red-500';

            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">${goldType} - ${title}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400">克数 (Grams)</label>
                        <input type="number" id="gold-grams" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">单价 (RM per gram)</label>
                        <input type="number" id="gold-price" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">日期</label>
                        <input type="date" id="gold-date" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" value="${new Date().toISOString().split('T')[0]}">
                    </div>
                    <button id="submit-btn" onclick="submitGoldTxn('${goldType}', '${txnType}')" class="w-full ${btnClass} text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
                        确认提交
                    </button>
                </div>
            `);
        }

        function submitGoldTxn(goldType, txnType) {
            let grams = parseFloat(document.getElementById('gold-grams').value);
            let price = parseFloat(document.getElementById('gold-price').value);
            let date = document.getElementById('gold-date').value;

            if (!grams || !price || grams <= 0 || price <= 0) { alert('请填写正确的克数与单价！'); return; }

            let btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = '提交中...';

            sendApi({ action: 'addGoldTransaction', goldType: goldType, txnType: txnType, grams: grams, price: price, date: date });
        }

        function openAddEPFAccountModal() {
            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">新增公积金账户</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-400">账户类别 (Category)</label>
                        <input type="text" id="epf-cat" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="例如：KWSP">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">基金名称 (Fund Name)</label>
                        <input type="text" id="epf-name" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="例如：Account 1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">初始本金 (RM)</label>
                        <input type="number" id="epf-bal" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00">
                    </div>
                    <button id="submit-btn" onclick="submitAddEPFAccount()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
                        创建账户
                    </button>
                </div>
            `);
        }

        function submitAddEPFAccount() {
            let cat = document.getElementById('epf-cat').value;
            let name = document.getElementById('epf-name').value;
            let bal = parseFloat(document.getElementById('epf-bal').value) || 0;
            if (!cat || !name) { alert('请填写完整！'); return; }
            sendApi({ action: 'addEPFAccount', category: cat, fundName: name, balance: bal });
        }

        function openAddCashAccountModal() {
            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">新增存款账户</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div><label class="text-xs text-slate-400">类型</label><input type="text" id="cash-type" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="Savings"></div>
                    <div><label class="text-xs text-slate-400">银行</label><input type="text" id="cash-bank" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="Maybank"></div>
                    <div><label class="text-xs text-slate-400">昵称</label><input type="text" id="cash-nick" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="工资账户"></div>
                    <div><label class="text-xs text-slate-400">初始余额</label><input type="number" id="cash-bal" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00"></div>
                    <button id="submit-btn" onclick="submitAddCashAccount()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">创建</button>
                </div>
            `);
        }

        function submitAddCashAccount() {
            let type = document.getElementById('cash-type').value;
            let bank = document.getElementById('cash-bank').value;
            let nick = document.getElementById('cash-nick').value;
            let bal = parseFloat(document.getElementById('cash-bal').value) || 0;
            if (!type || !bank || !nick) { alert('请完整填写！'); return; }
            sendApi({ action: 'addCashAccount', type: type, bankName: bank, nickname: nick, balance: bal });
        }

        function openAddStockModal() {
            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">新增股票</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div><label class="text-xs text-slate-400">代码 (Ticker)</label><input type="text" id="st-ticker" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="7277.KL"></div>
                    <div><label class="text-xs text-slate-400">名称</label><input type="text" id="st-name" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="Dialog Group"></div>
                    <div><label class="text-xs text-slate-400">市场</label><input type="text" id="st-market" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="大马股市"></div>
                    <button id="submit-btn" onclick="submitAddStock()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">添加</button>
                </div>
            `);
        }

        function submitAddStock() {
            let ticker = document.getElementById('st-ticker').value;
            let name = document.getElementById('st-name').value;
            let market = document.getElementById('st-market').value;
            if (!ticker || !name) { alert('请填写代码与名称！'); return; }
            sendApi({ action: 'addNewStock', ticker: ticker, stockName: name, market: market });
        }

        function openStockTxnModal(txnType, ticker) {
            showModal(`
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-base text-slate-100">${ticker} - ${txnType} 股票</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="space-y-3">
                    <div><label class="text-xs text-slate-400">股数 (Shares)</label><input type="number" id="st-shares" step="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0"></div>
                    <div><label class="text-xs text-slate-400">单价 (Price)</label><input type="number" id="st-price" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="0.00"></div>
                    <div><label class="text-xs text-slate-400">手续费 (Fees)</label><input type="number" id="st-fees" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" value="0.00"></div>
                    <div><label class="text-xs text-slate-400">券商 (Broker)</label><input type="text" id="st-broker" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 text-sm mt-1" placeholder="Mplus"></div>
                    <button id="submit-btn" onclick="submitStockTxn('${ticker}', '${txnType}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">提交</button>
                </div>
            `);
        }

        function submitStockTxn(ticker, txnType) {
            let shares = parseFloat(document.getElementById('st-shares').value);
            let price = parseFloat(document.getElementById('st-price').value);
            let fees = parseFloat(document.getElementById('st-fees').value) || 0;
            let broker = document.getElementById('st-broker').value;

            if (!shares || !price) { alert('请输入正确的股数与单价！'); return; }
            sendApi({ action: 'addStockTxn', ticker: ticker, txnType: txnType, shares: shares, price: price, fees: fees, broker: broker });
        }

        function openEPFHistoryModal(accountKey, fundName) {
            let txns = (globalData.epfTxns || []).filter(t => String(t.Account_Key || t.accountKey).trim() === String(accountKey).trim());
            let txnRows = '';
            if (txns.length > 0) {
                txns.forEach(t => {
                    let tid = t.Txn_ID || t.txnId;
                    let tType = t.Type || t.type;
                    let amt = parseFloat(t.Amount || t.amount || 0);
                    let dateStr = String(t.Date || t.date || '').split('T')[0];
                    let rem = t.remark || t.Remark || '无备注';

                    txnRows += `
                        <tr class="border-b border-slate-800 text-xs">
                            <td class="py-2.5">${dateStr}</td>
                            <td class="py-2.5">${tType}</td>
                            <td class="py-2.5 font-semibold ${tType.toLowerCase().includes('deposit') ? 'text-emerald-400' : 'text-red-400'}">RM ${amt.toFixed(2)}</td>
                            <td class="py-2.5 text-slate-400">${rem}</td>
                            <td class="py-2.5 text-right">
                                <button onclick="deleteEPFTxn('${tid}', '${accountKey}')" class="text-red-400 hover:text-red-300">删除</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                txnRows = `<tr><td colspan="5" class="text-center text-slate-500 py-4">暂无明细</td></tr>`;
            }

            showModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-base text-slate-100">${fundName} - 交易明细</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="max-h-80 overflow-y-auto">
                    <table class="w-full text-left">
                        <thead><tr class="border-b border-slate-800 text-xs text-slate-400"><th class="pb-2">日期</th><th class="pb-2">类型</th><th class="pb-2">金额</th><th class="pb-2">备注</th><th class="pb-2 text-right">操作</th></tr></thead>
                        <tbody>${txnRows}</tbody>
                    </table>
                </div>
            `);
        }

        function deleteEPFTxn(txnId, accountKey) {
            if (!confirm('确定删除此条明细？系统将自动安全重算余额')) return;
            sendApi({ action: 'deleteEPFTxn', txnId: txnId, accountKey: accountKey });
        }

        function openCashHistoryModal(accountId, nick) {
            let txns = (globalData.cashTxns || []).filter(t => String(t.Account_ID || t.accountId).trim() === String(accountId).trim());
            let txnRows = '';
            if (txns.length > 0) {
                txns.forEach(t => {
                    let tid = t.Txn_ID || t.txnId;
                    let tType = t.Type || t.type;
                    let amt = parseFloat(t.Amount || t.amount || 0);
                    let dateStr = String(t.Date || t.date || '').split('T')[0];
                    let rem = t.remark || t.Remark || '无备注';

                    txnRows += `
                        <tr class="border-b border-slate-800 text-xs">
                            <td class="py-2.5">${dateStr}</td>
                            <td class="py-2.5">${tType}</td>
                            <td class="py-2.5 font-semibold ${tType.toLowerCase().includes('deposit') || tType.toLowerCase().includes('in') ? 'text-emerald-400' : 'text-red-400'}">RM ${amt.toFixed(2)}</td>
                            <td class="py-2.5 text-slate-400">${rem}</td>
                            <td class="py-2.5 text-right">
                                <button onclick="deleteCashTxn('${tid}', '${accountId}')" class="text-red-400 hover:text-red-300">删除</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                txnRows = `<tr><td colspan="5" class="text-center text-slate-500 py-4">暂无明细</td></tr>`;
            }

            showModal(`
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-base text-slate-100">${nick} - 交易明细</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="max-h-80 overflow-y-auto">
                    <table class="w-full text-left">
                        <thead><tr class="border-b border-slate-800 text-xs text-slate-400"><th class="pb-2">日期</th><th class="pb-2">类型</th><th class="pb-2">金额</th><th class="pb-2">备注</th><th class="pb-2 text-right">操作</th></tr></thead>
                        <tbody>${txnRows}</tbody>
                    </table>
                </div>
            `);
        }

        function deleteCashTxn(txnId, accountId) {
            if (!confirm('确定删除此条明细？')) return;
            sendApi({ action: 'deleteCashTxn', txnId: txnId, accountId: accountId });
        }

        function showModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('app-modal').classList.remove('hidden');
            document.getElementById('app-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('app-modal').classList.remove('flex');
            document.getElementById('app-modal').classList.add('hidden');
        }

        function sendApi(payload) {
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    closeModal();
                    globalData = res.data;
                    renderDashboard(res.data);
                    alert('操作成功！');
                } else {
                    alert('操作失败: ' + res.message);
                    let btn = document.getElementById('submit-btn');
                    if(btn) { btn.disabled = false; btn.innerText = '确认提交'; }
                }
            })
            .catch(err => {
                console.error("API 错误:", err);
                alert('网络连接错误');
                let btn = document.getElementById('submit-btn');
                if(btn) { btn.disabled = false; btn.innerText = '确认提交'; }
            });
        }
    </script>
</body>
</html>
