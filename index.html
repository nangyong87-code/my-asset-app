<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackEzy Asset Tracker</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    [v-cloak] { display: none !important; }
    body { background-color: #0b120e; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-serif-num { font-family: 'Playfair Display', serif; }
    .forest-card { background: linear-gradient(145deg, #132219 0%, #0d1711 100%); border: 1px solid rgba(46, 78, 59, 0.4); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
    .btn-gold-border { background: rgba(19, 34, 25, 0.8); border: 1px solid #9a7b38; color: #d4af37; }
    .input-dark { background-color: #090f0b; border: 1px solid #1f3329; color: white; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.75rem; width: 100%; }
  </style>
</head>
<body class="min-h-screen pb-28 antialiased">

  <div id="app" v-cloak class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-[#090f0b] border-x border-[#1a2e22]">

    <!-- PIN Lock Modal -->
    <div v-if="isLocked" class="fixed inset-0 z-50 bg-[#090f0b] flex flex-col items-center justify-center p-6 space-y-6">
      <div class="w-16 h-16 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400 text-2xl shadow-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-white tracking-wide">TrackEzy 安全保护</h2>
        <p class="text-xs text-slate-400">请输入 6 位数 PIN 解锁 (默认 123456)</p>
      </div>

      <div class="flex gap-3 my-4">
        <div v-for="i in 6" :key="i" class="w-4 h-4 rounded-full border border-[#2e4e3b]" :class="pinInput.length >= i ? 'bg-amber-400' : 'bg-[#132219]'"></div>
      </div>

      <div class="grid grid-cols-3 gap-4 w-full max-w-xs pt-4">
        <button v-for="n in [1,2,3,4,5,6,7,8,9]" :key="n" @click="pressPin(n)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">{{ n }}</button>
        <button @click="pinInput = ''" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-xs font-bold active:scale-95 flex items-center justify-center mx-auto">清空</button>
        <button @click="pressPin(0)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">0</button>
        <button @click="pinInput = pinInput.slice(0, -1)" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-sm active:scale-95 flex items-center justify-center mx-auto"><i class="fa-solid fa-delete-left"></i></button>
      </div>
    </div>

    <!-- MAIN UI -->
    <template v-else>

      <header class="px-5 pt-6 pb-3 flex justify-between items-center bg-[#090f0b]/80 backdrop-blur-md sticky top-0 z-30 border-b border-[#1a2e22]">
        <h1 class="text-2xl font-black text-slate-100 tracking-tight">{{ currentTabTitle }}</h1>
        <div class="flex items-center gap-2">
          <button @click="fetchData" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-slate-300">
            <i class="fa-solid fa-rotate" :class="{'fa-spin': loading}"></i>
          </button>
          <button @click="isLocked = true" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400"><i class="fa-solid fa-lock text-xs"></i></button>
        </div>
      </header>

      <main class="p-4 space-y-4 flex-1">

        <!-- OVERVIEW -->
        <section v-if="activeTab === 'overview'" class="space-y-4">
          <div class="forest-card rounded-3xl p-5 relative overflow-hidden space-y-4">
            <div class="text-xs text-slate-400 font-medium">净资产总额</div>
            <div class="text-3xl font-bold tracking-tight text-white flex items-baseline gap-1.5">
              <span class="text-xl font-bold text-slate-200">RM</span>
              <span class="font-serif-num text-4xl text-slate-100">{{ formatNumber(displayedNetWorth) }}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button @click="useTP = false" :class="!useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-2 rounded-xl text-xs font-bold border">按市值</button>
              <button @click="useTP = true" :class="useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-2 rounded-xl text-xs font-bold border">按目标价 TP</button>
            </div>

            <div class="grid grid-cols-3 gap-y-3 gap-x-2 pt-3 border-t border-[#1a2e22] text-xs">
              <div><span class="text-blue-400">● 现金</span><div class="font-serif-num font-bold">RM {{ formatNumber(totals.cash) }}</div></div>
              <div><span class="text-cyan-400">● 存款</span><div class="font-serif-num font-bold">RM {{ formatNumber(totals.bank) }}</div></div>
              <div><span class="text-amber-400">● 黄金</span><div class="font-serif-num font-bold">RM {{ formatNumber(totals.gold) }}</div></div>
              <div><span class="text-rose-400">● 股票</span><div class="font-serif-num font-bold">RM {{ formatNumber(useTP ? totals.stockTP : totals.stockMarket) }}</div></div>
              <div><span class="text-purple-400">● EPF/PRS</span><div class="font-serif-num font-bold">RM {{ formatNumber(totals.epf) }}</div></div>
            </div>

            <button @click="openSnapshotModal" class="w-full btn-gold-border font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2"><i class="fa-solid fa-camera"></i> 记录本月净值 (Snapshot)</button>
          </div>

          <div class="space-y-2">
            <div class="text-xs text-slate-400 font-bold px-1">📜 历史快照列表</div>
            <div v-for="h in historyList.slice().reverse()" :key="h.Record_Date" class="forest-card rounded-2xl p-3.5 flex justify-between items-center text-xs">
              <div>
                <div class="font-bold text-slate-200 font-mono">{{ h.Record_Date }}</div>
                <div class="text-[10px] text-slate-400">{{ h.Remarks || '月度快照' }}</div>
              </div>
              <div class="font-serif-num font-bold text-slate-100 text-sm">RM {{ formatNumber(h.Total_Net_Worth) }}</div>
            </div>
          </div>
        </section>

        <!-- CASH -->
        <section v-if="activeTab === 'cash'" class="space-y-4">
          <div class="flex justify-between items-center bg-[#132219] p-4 rounded-2xl border border-[#1f3329]">
            <div>
              <div class="text-xs text-slate-400">存款与现金总计</div>
              <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.cash + totals.bank) }}</div>
            </div>
            <div class="flex gap-1.5">
              <button @click="showAddCashModal = true" class="btn-gold-border px-2.5 py-1.5 rounded-xl text-xs font-bold">+ 新增户口</button>
              <button @click="showCashTxnModal = true" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 rounded-xl text-xs font-bold">± 存取/转账</button>
            </div>
          </div>

          <div class="space-y-2">
            <div class="text-xs font-bold text-slate-300 px-1">💵 现金 (Cash)</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Cash')" :key="acc.Account_ID" @click="openTxnHistoryModal(acc)" class="forest-card rounded-2xl p-3.5 flex justify-between items-center cursor-pointer active:scale-98 transition">
              <div>
                <div class="font-bold text-sm text-slate-100">{{ acc.Account_Nickname }}</div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看历史明细 ➔</div>
              </div>
              <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
            </div>
          </div>

          <div class="space-y-2 pt-2">
            <div class="text-xs font-bold text-slate-300 px-1">🏦 银行存款户口</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Bank')" :key="acc.Account_ID" @click="openTxnHistoryModal(acc)" class="forest-card rounded-2xl p-3.5 flex justify-between items-center cursor-pointer active:scale-98 transition">
              <div>
                <div class="font-bold text-sm text-slate-100">{{ acc.Bank_Name }} <span class="text-xs font-normal text-slate-400">({{ acc.Account_Nickname }})</span></div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看历史明细 ➔</div>
              </div>
              <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
            </div>
          </div>
        </section>

        <!-- GOLD (完美修复黄金买卖与明细) -->
        <section v-if="activeTab === 'gold'" class="space-y-4">
          <div class="flex justify-between items-center bg-[#132219] p-4 rounded-2xl border border-[#1f3329]">
            <div>
              <div class="text-xs text-amber-400 font-medium">黄金总市值</div>
              <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.gold) }}</div>
            </div>
            <div class="flex gap-1.5">
              <button @click="showAddGoldModal = true" class="btn-gold-border px-2.5 py-1.5 rounded-xl text-xs font-bold">± 黄金买卖</button>
              <button @click="showGoldTxnModal = true" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 rounded-xl text-xs font-bold">📜 交易明细</button>
            </div>
          </div>

          <div class="space-y-2">
            <div v-for="g in goldList" :key="g.Type" class="forest-card rounded-2xl p-4 flex justify-between items-center">
              <div>
                <div class="font-bold text-sm text-slate-100">{{ g.Type === 'Paper' ? '🪙 纸黄金 (Paper Gold)' : '🥇 实体金条 (Gold Bar)' }}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">{{ g.Grams }} 克 · 均价 RM {{ formatNumber(g.Avg_Price) }}/g</div>
              </div>
              <div class="font-serif-num font-bold text-amber-300">RM {{ formatNumber(g.Market_Value) }}</div>
            </div>
          </div>
        </section>

        <!-- EPF -->
        <section v-if="activeTab === 'epf'" class="space-y-4">
          <div class="bg-[#132219] p-4 rounded-2xl border border-[#1f3329] flex justify-between items-center">
            <div>
              <div class="text-xs text-purple-400">公积金 & PRS 总额</div>
              <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.epf) }}</div>
            </div>
            <div class="flex gap-1.5">
              <button @click="showAddEPFAccModal = true" class="btn-gold-border px-2.5 py-1.5 rounded-xl text-xs font-bold">+ 新增账户</button>
              <button @click="showAddEPFModal = true" class="bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2.5 py-1.5 rounded-xl text-xs font-bold">± 供款/提取</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div v-for="fund in epfData" :key="fund.Account_Key" @click="openEPFTxnModal(fund)" class="forest-card rounded-2xl p-4 flex justify-between items-center cursor-pointer active:scale-98 transition">
              <div>
                <span class="text-[9px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">{{ fund.Category }}</span>
                <div class="font-bold text-slate-100 text-base mt-1.5">{{ fund.Fund_Name }}</div>
                <div class="text-[10px] text-purple-300/80 mt-0.5">点击查看明细 ➔</div>
              </div>
              <div class="font-serif-num font-bold text-slate-100 text-base">RM {{ formatNumber(fund.Current_Balance) }}</div>
            </div>
          </div>
        </section>

        <!-- STOCKS 模块 -->
        <section v-if="activeTab === 'stocks'" class="space-y-3">
          
          <!-- 股票摘要面板 (Summary & Dividend Summary) -->
          <div class="forest-card rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-emerald-400 font-medium">📈 股票持仓总市值</div>
                <div class="font-serif-num text-2xl font-bold text-white mt-0.5">RM {{ formatNumber(totals.stockMarket) }}</div>
              </div>
              <div class="flex gap-2">
                <button @click="autoFetchAllPrices" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5">
                  <i class="fa-solid fa-rotate" :class="{'fa-spin': updatingPrices}"></i> 更新股价
                </button>
                <button @click="showNewStockModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22] text-xs">
              <div class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
                <div class="text-[10px] text-slate-400">总未实现盈亏</div>
                <div class="font-serif-num font-bold text-sm mt-0.5" :class="totalUnrealizedPL >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                  {{ totalUnrealizedPL >= 0 ? '+' : '' }}RM {{ formatNumber(totalUnrealizedPL) }}
                </div>
              </div>
              <div class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
                <div class="text-[10px] text-slate-400">💰 累计总股息</div>
                <div class="font-serif-num font-bold text-amber-300 text-sm mt-0.5">
                  RM {{ formatNumber(totalDividendsSum) }}
                </div>
              </div>
            </div>
          </div>

          <!-- 排序栏与汇率 -->
          <div class="flex justify-between items-center px-1 text-xs">
            <div class="flex items-center gap-2">
              <span class="text-slate-400">排序:</span>
              <select v-model="stockSortMode" class="bg-[#132219] border border-[#2e4e3b] text-amber-300 rounded-lg px-2 py-1 text-xs outline-none">
                <option value="default">默认</option>
                <option value="valueDesc">市值由高到低</option>
                <option value="plDesc">赚幅由高至低</option>
              </select>
            </div>
            <span class="text-[10px] text-slate-500">1 USD = {{ usdFxRate }} MYR</span>
          </div>

          <!-- 股票卡片列表 -->
          <div class="space-y-2.5">
            <div v-if="sortedStockData.length === 0" class="text-xs text-slate-500 p-8 text-center border border-dashed border-[#1f3329] rounded-2xl">
              暂无股票卡片，点击右上角“+ 新增”创建
            </div>

            <div v-for="s in sortedStockData" :key="s.Ticker" class="forest-card rounded-2xl p-4 space-y-2 transition">
              <div @click="openStockDetail(s)" class="flex justify-between items-start cursor-pointer">
                <div>
                  <div class="font-extrabold text-base text-white flex items-center gap-2">
                    {{ s.Stock_Name }}
                  </div>
                  <div class="text-xs text-slate-400 font-mono mt-0.5">
                    {{ s.Ticker }} · <span class="text-amber-400">{{ s.Market || '大马股' }}</span>
                  </div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-slate-100 text-lg">
                    RM {{ formatNumber(getStockMarketValMYR(s)) }}
                  </div>
                  <div :class="getStockUnrealizedPL(s) >= 0 ? 'text-emerald-400' : 'text-rose-400'" class="text-[11px] font-bold">
                    {{ getStockUnrealizedPL(s) >= 0 ? '+' : '' }}RM {{ formatNumber(getStockUnrealizedPL(s)) }}
                    ({{ getStockUnrealizedPLPct(s) }}%)
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-[11px] text-slate-400">
                <div @click="openStockDetail(s)" class="cursor-pointer">{{ s.Total_Shares || 0 }} 股 · 现价 {{ s.Currency === 'USD' ? '$' : 'RM' }}{{ formatNumber(s.Current_Price) }}</div>
                <div class="flex gap-3">
                  <span @click="openStockDetail(s)" class="text-amber-400 cursor-pointer">详情/交易 ➔</span>
                  <span @click="deleteStockCard(s)" class="text-rose-400 cursor-pointer hover:underline">删除</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- SETTINGS -->
        <section v-if="activeTab === 'settings'" class="space-y-4">
          <div class="forest-card rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-sm text-white">⚙️ 汇率设置 (FX Rates)</h3>
            <div>
              <label class="block text-xs text-slate-400 mb-1">1 美金 (USD) 折合马币 (MYR)</label>
              <input type="number" step="0.01" v-model="usdFxRate" class="input-dark">
            </div>
          </div>
        </section>

      </main>

      <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#080d09]/95 backdrop-blur-md border-t border-[#1a2e22] px-2 py-2.5 grid grid-cols-6 gap-1 text-[10px] text-center font-medium z-40">
        <button v-for="tab in tabs" :key="tab.id" @click="activeTab = tab.id" :class="activeTab === tab.id ? 'text-amber-400 font-bold' : 'text-slate-500'" class="flex flex-col items-center justify-center gap-1 py-1">
          <i :class="tab.icon" class="text-base"></i>
          <span>{{ tab.name }}</span>
        </button>
      </footer>

      <!-- 黄金买卖 Modal -->
      <div v-if="showAddGoldModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#0d1711] border border-[#2e4e3b] w-full max-w-xs rounded-3xl p-5 space-y-3">
          <h3 class="font-bold text-base text-white">🪙 黄金买卖记录</h3>
          <div><label class="block text-[11px] text-slate-400 mb-1">买/卖</label><select v-model="goldForm.txnType" class="input-dark"><option value="buy">➕ 买入 (Buy)</option><option value="sell">➖ 卖出 (Sell)</option></select></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">黄金类型</label><select v-model="goldForm.goldType" class="input-dark"><option value="Paper">纸黄金 (Paper Gold)</option><option value="Physical">实体金条 (Gold Bar)</option></select></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">账户/机构名称</label><input type="text" v-model="goldForm.accountName" placeholder="如 Maybank Gold" class="input-dark"></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">重量 (克 Grams)</label><input type="number" step="0.01" v-model="goldForm.grams" placeholder="0.00" class="input-dark"></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">单价 (RM / 克)</label><input type="number" step="0.01" v-model="goldForm.price" placeholder="0.00" class="input-dark"></div>
          <div class="flex gap-2 pt-2"><button @click="showAddGoldModal = false" class="flex-1 bg-[#132219] text-slate-300 py-2 rounded-xl text-xs">取消</button><button @click="submitAddGold" class="flex-1 btn-gold-border font-bold py-2 rounded-xl text-xs">保存</button></div>
        </div>
      </div>

      <!-- 黄金交易明细 Modal -->
      <div v-if="showGoldTxnModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#0d1711] border border-[#2e4e3b] w-full max-w-md rounded-3xl p-5 space-y-4 max-h-[85vh] flex flex-col">
          <div class="flex justify-between items-center border-b border-[#1f3329] pb-3">
            <h3 class="font-extrabold text-base text-white">📜 黄金买卖交易明细</h3>
            <button @click="showGoldTxnModal = false" class="w-8 h-8 rounded-full bg-[#132219] text-slate-400 flex items-center justify-center text-sm">✕</button>
          </div>

          <div class="space-y-2 overflow-y-auto flex-1">
            <div v-if="goldTxns.length === 0" class="text-xs text-slate-500 py-6 text-center">暂无黄金交易历史</div>
            <div v-for="t in goldTxns.slice().reverse()" :key="t.Txn_ID" class="bg-[#132219] border border-[#1f3329] rounded-2xl p-3 flex justify-between items-center text-xs">
              <div>
                <div class="font-bold text-slate-200">{{ t.Txn_Type === 'buy' ? '➕ 买入' : '➖ 卖出' }} · {{ t.Date }}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">{{ t.Gold_Type === 'Paper' ? '纸黄金' : '实体金条' }} · {{ t.Grams }} 克 @ RM {{ formatNumber(t.Price) }}/g</div>
              </div>
              <div class="text-right">
                <div class="font-serif-num font-bold text-amber-300">RM {{ formatNumber((parseFloat(t.Grams)||0) * (parseFloat(t.Price)||0)) }}</div>
                <button @click="deleteGoldTxn(t)" class="text-rose-400 text-[10px] hover:underline mt-1">删除</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 1. 新增股票 Modal -->
      <div v-if="showNewStockModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#0d1711] border border-[#2e4e3b] w-full max-w-xs rounded-3xl p-5 space-y-3">

          <h3 class="font-bold text-base text-white">± 公积金供款 / 提取</h3>
          <div><label class="block text-[11px] text-slate-400 mb-1">选择账户</label><select v-model="epfForm.accountKey" class="input-dark"><option v-for="e in epfData" :key="e.Account_Key" :value="e.Account_Key">{{ e.Fund_Name }}</option></select></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">类型</label><select v-model="epfForm.type" class="input-dark"><option value="Deposit">➕ 供款/存款</option><option value="Withdrawal">➖ 提取</option></select></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">金额 (RM)</label><input type="number" v-model="epfForm.amount" placeholder="0.00" class="input-dark"></div>
          <div class="flex gap-2 pt-2"><button @click="showAddEPFModal = false" class="flex-1 bg-[#132219] text-slate-300 py-2 rounded-xl text-xs">取消</button><button @click="submitAddEPFTransaction" class="flex-1 btn-gold-border font-bold py-2 rounded-xl text-xs">提交</button></div>
        </div>
      </div>

      <div v-if="showSnapshotModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#0d1711] border border-[#2e4e3b] w-full max-w-xs rounded-3xl p-5 space-y-4">
          <h3 class="font-bold text-base text-white">📷 记录月度资产快照</h3>
          <div class="text-xs text-slate-300 bg-[#132219] p-3 rounded-xl border border-[#1f3329]">当前净值: <span class="font-bold text-amber-400 font-serif-num">RM {{ formatNumber(displayedNetWorth) }}</span></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">快照日期</label><input type="date" v-model="snapshotForm.date" class="input-dark"></div>
          <div><label class="block text-[11px] text-slate-400 mb-1">Remarks 备注</label><input type="text" v-model="snapshotForm.remarks" placeholder="备注" class="input-dark"></div>
          <div class="flex gap-2 pt-2"><button @click="showSnapshotModal = false" class="flex-1 bg-[#132219] text-slate-200 py-2.5 rounded-xl text-xs">取消</button><button @click="submitSnapshot" class="flex-1 btn-gold-border font-bold py-2.5 rounded-xl text-xs">保存快照</button></div>
        </div>
      </div>

    </template>

  </div>

  <script>
    var GAS_API_URL = "https://script.google.com/macros/s/AKfycbzA3CAhPJxK7eutjvuJQKk0sEUZAriELbBatFpOv9LDnaHjWbX0natGQgMWT_Ycf9Xc/exec";

    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const isLocked = ref(true);
        const pinInput = ref('');
        const correctPin = '123456';

        const loading = ref(false);
        const updatingPrices = ref(false);
        const activeTab = ref('overview');
        const useTP = ref(false);
        const usdFxRate = ref(4.40);
        const stockSortMode = ref('default');

        const tabs = [
          { id: 'overview', name: '总览', icon: 'fa-solid fa-house' },
          { id: 'cash', name: '现金', icon: 'fa-solid fa-wallet' },
          { id: 'gold', name: '黄金', icon: 'fa-solid fa-coins' },
          { id: 'epf', name: '公积金', icon: 'fa-solid fa-shield-halved' },
          { id: 'stocks', name: '股票', icon: 'fa-solid fa-chart-line' },
          { id: 'settings', name: '设置', icon: 'fa-solid fa-gear' }
        ];

        const cashAccounts = ref([]);
        const cashTxns = ref([]);
        const goldList = ref([]);
        const goldTxns = ref([]);
        const stockData = ref([]);
        const stockTxns = ref([]);
        const stockDividends = ref([]);
        const epfData = ref([]);
        const epfTxns = ref([]);
        const historyList = ref([]);

        const showAddCashModal = ref(false);
        const cashForm = ref({ type: 'Bank', bankName: '', nickname: '', balance: '' });

        const showCashTxnModal = ref(false);
        const cashTxnForm = ref({ type: 'in', accountId: '', fromAccountId: '', toAccountId: '', amount: '', remark: '' });

        const showTxnHistoryModal = ref(false);
        const selectedAccount = ref(null);
        const accountTxns = computed(() => {
          if (!selectedAccount.value) return [];
          return cashTxns.value.filter(t => String(t.Account_ID).trim() === String(selectedAccount.value.Account_ID).trim()).reverse();
        });
        const openTxnHistoryModal = (acc) => { selectedAccount.value = acc; showTxnHistoryModal.value = true; };

        // GOLD
        const showAddGoldModal = ref(false);
        const showGoldTxnModal = ref(false);
        const goldForm = ref({ txnType: 'buy', goldType: 'Paper', accountName: 'Maybank Gold', grams: '', price: '' });

        const submitAddGold = async () => {
          if (!goldForm.value.grams || !goldForm.value.price) return alert('请填全重量与单价！');
          showAddGoldModal.value = false;
          await postAction('addGoldTransaction', goldForm.value);
        };

        const deleteGoldTxn = async (t) => {
          if (confirm('确定删除此笔黄金交易记录？')) {
            await postAction('deleteGoldTxn', { txnId: t.Txn_ID });
          }
        };

        // EPF
        const showAddEPFAccModal = ref(false);
        const epfAccForm = ref({ category: 'EPF', fundName: '', balance: '' });
        const showAddEPFModal = ref(false);
        const epfForm = ref({ accountKey: '', type: 'Deposit', amount: '' });
        const showEPFTxnModal = ref(false);
        const selectedEPFAccount = ref(null);
        const epfAccountTxns = computed(() => {
          if (!selectedEPFAccount.value) return [];
          return epfTxns.value.filter(t => String(t.Account_Key).trim() === String(selectedEPFAccount.value.Account_Key).trim()).reverse();
        });
        const openEPFTxnModal = (fund) => { selectedEPFAccount.value = fund; showEPFTxnModal.value = true; };

        const showNewStockModal = ref(false);
        const newStockForm = ref({ stockName: '', ticker: '', market: '大马股' });

        const showStockDetailModal = ref(false);
        const selectedStock = ref(null);

        const showAddStockTxnModal = ref(false);
        const stockTxnForm = ref({ txnType: 'Buy', ticker: '', broker: 'moomoo', date: '', shares: '', price: '', fees: '', linkedAccountId: '' });

        const showAddDivModal = ref(false);
        const divForm = ref({ ticker: '', exDate: '', perShareAmount: '', totalDividend: '', linkedAccountId: '' });

        const showSnapshotModal = ref(false);
        const snapshotForm = ref({ date: '', remarks: '' });

        const pressPin = (num) => {
          if (pinInput.value.length < 6) {
            pinInput.value += num;
            if (pinInput.value.length === 6) {
              if (pinInput.value === correctPin) isLocked.value = false;
              else { alert('PIN 码错误！'); pinInput.value = ''; }
            }
          }
        };

        const currentTabTitle = computed(() => tabs.find(x => x.id === activeTab.value)?.name || 'TrackEzy');

        const totals = computed(() => {
          let cash = 0, bank = 0, gold = 0, stockMarket = 0, stockTP = 0, epf = 0;
          cashAccounts.value.forEach(a => { const v = parseFloat(a.Current_Balance) || 0; if (a.Type === 'Cash') cash += v; else bank += v; });
          goldList.value.forEach(g => { gold += parseFloat(g.Market_Value) || 0; });

          stockData.value.forEach(s => {
            const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
            stockMarket += (parseFloat(s.Market_Value_MYR) || 0) * fx;
            stockTP += (parseFloat(s.TP_Value_MYR) || 0) * fx;
          });

          epfData.value.forEach(e => { epf += parseFloat(e.Current_Balance) || 0; });
          return { cash, bank, gold, stockMarket, stockTP, epf };
        });

        const displayedNetWorth = computed(() => totals.value.cash + totals.value.bank + totals.value.gold + (useTP.value ? totals.value.stockTP : totals.value.stockMarket) + totals.value.epf);

        const totalUnrealizedPL = computed(() => {
          let total = 0;
          stockData.value.forEach(s => { total += getStockUnrealizedPL(s); });
          return total;
        });

        const totalDividendsSum = computed(() => {
          let total = 0;
          stockDividends.value.forEach(d => { total += parseFloat(d.Total_Dividend_MYR) || 0; });
          return total;
        });

        const sortedStockData = computed(() => {
          let list = [...stockData.value];
          if (stockSortMode.value === 'valueDesc') {
            list.sort((a, b) => getStockMarketValMYR(b) - getStockMarketValMYR(a));
          } else if (stockSortMode.value === 'plDesc') {
            list.sort((a, b) => getStockUnrealizedPL(b) - getStockUnrealizedPL(a));
          }
          return list;
        });

        const selectedStockTxns = computed(() => {
          if (!selectedStock.value) return [];
          return stockTxns.value.filter(t => String(t.Ticker).trim().toUpperCase() === String(selectedStock.value.Ticker).trim().toUpperCase()).reverse();
        });

        const selectedStockDivs = computed(() => {
          if (!selectedStock.value) return [];
          return stockDividends.value.filter(d => String(d.Ticker).trim().toUpperCase() === String(selectedStock.value.Ticker).trim().toUpperCase()).reverse();
        });

        const getStockMarketValMYR = (s) => {
          if (!s) return 0;
          const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
          return (parseFloat(s.Total_Shares) || 0) * (parseFloat(s.Current_Price) || 0) * fx;
        };

        const getStockUnrealizedPL = (s) => {
          if (!s) return 0;
          const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
          const currentVal = (parseFloat(s.Total_Shares) || 0) * (parseFloat(s.Current_Price) || 0);
          const costVal = (parseFloat(s.Total_Shares) || 0) * (parseFloat(s.Avg_Cost_Per_Share) || 0);
          return (currentVal - costVal) * fx;
        };

        const getStockUnrealizedPLPct = (s) => {
          if (!s) return '0.0';
          const cost = parseFloat(s.Avg_Cost_Per_Share) || 0;
          if (cost === 0) return '0.0';
          const cur = parseFloat(s.Current_Price) || 0;
          return (((cur - cost) / cost) * 100).toFixed(1);
        };

        const getStockRealizedPL = (s) => {
          if (!s) return 0;
          let total = 0;
          const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
          stockTxns.value.forEach(t => {
            if (String(t.Ticker).trim().toUpperCase() === String(s.Ticker).trim().toUpperCase() && t.Txn_Type === 'Sell') {
              const shares = parseFloat(t.Shares) || 0;
              const price = parseFloat(t.Price) || 0;
              const fees = parseFloat(t.Txn_Fees) || 0;
              const avgCost = parseFloat(s.Avg_Cost_Per_Share) || 0;
              total += ((shares * price) - fees - (shares * avgCost));
            }
          });
          return total * fx;
        };

        const fetchData = async () => {
          loading.value = true;
          try {
            const res = await fetch(`${GAS_API_URL}?action=getOverview&t=${Date.now()}`);
            const json = await res.json();
            if (json.status === 'success') {
              cashAccounts.value = json.data.cashAccounts || [];
              cashTxns.value = json.data.cashTxns || [];
              goldList.value = json.data.goldList || [];
              goldTxns.value = json.data.goldTxns || [];
              stockData.value = json.data.stockData || [];
              stockTxns.value = json.data.stockTxns || [];
              stockDividends.value = json.data.stockDividends || [];
              epfData.value = json.data.epfData || [];
              epfTxns.value = json.data.epfTxns || [];
              historyList.value = json.data.history || [];
            }
          } catch (e) { console.error(e); } finally { loading.value = false; }
        };

        const postAction = async (action, body) => {
          loading.value = true;
          try {
            const payload = JSON.stringify({ action, ...body });
            const res = await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload });
            const json = await res.json();
            if (json.status === 'success' && json.data) {
              cashAccounts.value = json.data.cashAccounts || [];
              cashTxns.value = json.data.cashTxns || [];
              goldList.value = json.data.goldList || [];
              goldTxns.value = json.data.goldTxns || [];
              stockData.value = json.data.stockData || [];
              stockTxns.value = json.data.stockTxns || [];
              stockDividends.value = json.data.stockDividends || [];
              epfData.value = json.data.epfData || [];
              epfTxns.value = json.data.epfTxns || [];
              historyList.value = json.data.history || [];
              alert('操作成功！');
            } else {
              if (json.message) alert(json.message);
              await fetchData();
            }
          } catch (e) { alert('网络开小差了，请重试'); } finally { loading.value = false; }
        };

        const autoFetchAllPrices = async () => {
          updatingPrices.value = true;
          try {
            for (let s of stockData.value) {
              try {
                const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${s.Ticker}?interval=1d&range=1d`);
                const data = await res.json();
                const price = data.chart.result[0].meta.regularMarketPrice;
                if (price) {
                  await postAction('updateStockPrice', { ticker: s.Ticker, currentPrice: price });
                }
              } catch (err) {
                console.log(`自动抓取 ${s.Ticker} 失败，可手动输入`);
              }
            }
            alert('股价更新尝试完成！若部分因跨域限制未更新，可直接点击卡片手动输入。');
          } finally { updatingPrices.value = false; }
        };

        const submitNewStock = async () => {
          if (!newStockForm.value.stockName || !newStockForm.value.ticker) return alert('请填全名字和代码！');
          showNewStockModal.value = false;
          await postAction('addNewStock', newStockForm.value);
        };

        const deleteStockCard = async (s) => {
          if (confirm(`确认删除股票 ${s.Stock_Name} (${s.Ticker}) 吗？`)) {
            await postAction('deleteStock', { ticker: s.Ticker });
          }
        };

        const openStockDetail = (s) => {
          selectedStock.value = s;
          showStockDetailModal.value = true;
        };

        const openAddTxnForStock = (type) => {
          const today = new Date().toISOString().split('T')[0];
          stockTxnForm.value = { 
            txnType: type, 
            ticker: selectedStock.value.Ticker, 
            broker: 'moomoo', 
            date: today, shares: '', price: '', fees: '', linkedAccountId: '' 
          };
          showAddStockTxnModal.value = true;
        };

        const submitAddStockTxn = async () => {
          if (!stockTxnForm.value.shares || !stockTxnForm.value.price) return alert('请填全股数与单价！');
          
          if (stockTxnForm.value.txnType === 'Sell') {
            const currentShares = parseFloat(selectedStock.value.Total_Shares) || 0;
            const sellShares = parseFloat(stockTxnForm.value.shares) || 0;
            if (sellShares > currentShares) {
              return alert(`逻辑错误！当前持有 ${currentShares} 股，无法卖出 ${sellShares} 股！请重新输入。`);
            }
          }

          showAddStockTxnModal.value = false;
          await postAction('addStockTxn', stockTxnForm.value);
        };

        const promptUpdatePrice = async (s) => {
          const newPrice = prompt(`更新 ${s.Ticker} 的当前现价 (${s.Currency}):`, s.Current_Price);
          if (newPrice === null) return;
          await postAction('updateStockPrice', { ticker: s.Ticker, currentPrice: newPrice });
        };

        const promptUpdateTP = async (s) => {
          const newTP = prompt(`更新 ${s.Ticker} 的目标价 TP (${s.Currency}):`, s.Target_Price_TP || s.Current_Price);
          if (newTP === null) return;
          await postAction('updateStockTP', { ticker: s.Ticker, targetPrice: newTP });
        };

        const deleteStockTxn = async (t) => {
          if (confirm('确定删除此笔交易明细？')) {
            await postAction('deleteStockTxn', { txnId: t.Txn_ID });
          }
        };

        const openAddDivForStock = () => {
          const today = new Date().toISOString().split('T')[0];
          divForm.value = { ticker: selectedStock.value.Ticker, exDate: today, perShareAmount: '', totalDividend: '', linkedAccountId: '' };
          showAddDivModal.value = true;
        };

        const submitAddDiv = async () => {
          if (!divForm.value.totalDividend) return alert('请输入派发总金额！');
          showAddDivModal.value = false;
          await postAction('addStockDividend', divForm.value);
        };

        const deleteStockDividend = async (d) => {
          if (confirm('确认删除此笔股息？')) {
            await postAction('deleteStockDividend', { divId: d.Div_ID });
          }
        };

        const submitAddCash = async () => {
          if (cashForm.value.type === 'Bank' && !cashForm.value.bankName) return alert('请输入机构名字！');
          showAddCashModal.value = false;
          await postAction('addCashAccount', cashForm.value);
        };

        const submitCashTxn = async () => {
          if (!cashTxnForm.value.amount) return alert('请输入变动金额！');
          showCashTxnModal.value = false;
          await postAction('updateCashBalance', cashTxnForm.value);
        };

        const deleteCashTxn = async (t) => {
          if (confirm('确认删除此笔资金流水？')) {
            await postAction('deleteCashTxn', { txnId: t.Txn_ID, accountId: t.Account_ID });
          }
        };

        const submitAddEPFAccount = async () => {
          if (!epfAccForm.value.fundName) return alert('请输入公积金账户名称！');
          showAddEPFAccModal.value = false;
          await postAction('addEPFAccount', epfAccForm.value);
        };

        const submitAddEPFTransaction = async () => {
          if (!epfForm.value.amount) return alert('请输入金额！');
          showAddEPFModal.value = false;
          await postAction('addEPFTransaction', epfForm.value);
        };

        const deleteEPFTxn = async (t) => {
          if (confirm('确认删除此笔公积金明细？')) {
            await postAction('deleteEPFTxn', { txnId: t.Txn_ID, accountKey: t.Account_Key });
          }
        };

        const openSnapshotModal = () => {
          const now = new Date();
          snapshotForm.value = { date: new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0], remarks: '' };
          showSnapshotModal.value = true;
        };

        const submitSnapshot = async () => {
          if (!snapshotForm.value.remarks) return alert('请填写 Remarks！');
          showSnapshotModal.value = false;
          await postAction('logSnapshot', { totalNetWorth: displayedNetWorth.value, recordDate: snapshotForm.value.date, remarks: snapshotForm.value.remarks });
        };

        const formatNumber = (val) => {
          const num = parseFloat(String(val).replace(/,/g, ''));
          return isNaN(num) ? '0.00' : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        onMounted(() => { fetchData(); });

        return {
          isLocked, pinInput, pressPin, loading, updatingPrices, activeTab, tabs, useTP, usdFxRate, stockSortMode, currentTabTitle,
          cashAccounts, cashTxns, goldList, goldTxns, stockData, sortedStockData, stockTxns, stockDividends, epfData, epfTxns, historyList, totals, displayedNetWorth,
          totalUnrealizedPL, totalDividendsSum, autoFetchAllPrices,
          showAddCashModal, cashForm, showCashTxnModal, cashTxnForm, showTxnHistoryModal, selectedAccount, accountTxns, openTxnHistoryModal, deleteCashTxn,
          showAddGoldModal, showGoldTxnModal, goldForm, submitAddGold, deleteGoldTxn,
          showAddEPFAccModal, epfAccForm, showAddEPFModal, epfForm, showEPFTxnModal, selectedEPFAccount, epfAccountTxns, openEPFTxnModal, submitAddEPFAccount, submitAddEPFTransaction, deleteEPFTxn,
          showNewStockModal, newStockForm, submitNewStock, deleteStockCard,
          showStockDetailModal, selectedStock, selectedStockTxns, selectedStockDivs, openStockDetail, promptUpdatePrice, promptUpdateTP,
          showAddStockTxnModal, stockTxnForm, openAddTxnForStock, submitAddStockTxn, deleteStockTxn,
          showAddDivModal, divForm, openAddDivForStock, submitAddDiv, deleteStockDividend,
          getStockMarketValMYR, getStockUnrealizedPL, getStockUnrealizedPLPct, getStockRealizedPL,
          showSnapshotModal, snapshotForm, fetchData, submitAddCash, submitCashTxn, openSnapshotModal, submitSnapshot, formatNumber
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
