<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackEzy Asset Tracker</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    [v-cloak] { display: none !important; }
    body { background-color: #0b120e; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-serif-num { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; }
    .forest-card { background: linear-gradient(145deg, #132219 0%, #0d1711 100%); border: 1px solid rgba(46, 78, 59, 0.4); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
    .btn-gold-border { background: rgba(19, 34, 25, 0.8); border: 1px solid #9a7b38; color: #d4af37; }
    .btn-gold-border:active { background: #9a7b38; color: #000; }
    .input-dark { background-color: #090f0b; border: 1px solid #1f3329; color: white; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.75rem; width: 100%; font-variant-numeric: tabular-nums; outline: none; }
    .input-dark:focus { border-color: #3b82f6; }
    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #090f0b; }
    ::-webkit-scrollbar-thumb { background: #1f3329; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen pb-20 antialiased bg-[#0b120e] sm:py-6">

  <!-- 精致高级黑框外壳容器 -->
  <div id="app" v-cloak class="max-w-md mx-auto min-h-screen sm:min-h-[92vh] sm:rounded-3xl flex flex-col justify-between relative shadow-2xl bg-[#090f0b] border-x sm:border border-[#1a2e22] overflow-hidden">

    <!-- PIN Lock Modal -->
    <div v-if="isLocked" class="fixed inset-0 z-50 bg-[#090f0b] flex flex-col items-center justify-center p-6 space-y-6">
      <div class="w-16 h-16 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400 text-2xl shadow-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-white tracking-wide">TrackEzy 安全保护</h2>
        <p class="text-xs text-slate-400">请输入解锁 PIN 码</p>
      </div>

      <div class="flex gap-3 my-4">
        <div v-for="i in 6" :key="i" class="w-4 h-4 rounded-full border border-[#2e4e3b]" :class="pinInput.length >= i ? 'bg-amber-400 border-amber-400' : 'bg-[#132219]'"></div>
      </div>

      <div class="grid grid-cols-3 gap-4 w-full max-w-xs pt-2">
        <button v-for="n in [1,2,3,4,5,6,7,8,9]" :key="n" @click="pressPin(n)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto transition">{{ n }}</button>
        <button @click="pinInput = ''" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-xs font-bold active:scale-95 flex items-center justify-center mx-auto">清空</button>
        <button @click="pressPin(0)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">0</button>
        <button @click="pinInput = pinInput.slice(0, -1)" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-sm active:scale-95 flex items-center justify-center mx-auto"><i class="fa-solid fa-delete-left"></i></button>
      </div>
    </div>

    <!-- MAIN UI -->
    <template v-else>

      <!-- 顶栏 Header -->
      <header class="px-5 pt-5 pb-3 flex justify-between items-center bg-[#090f0b]/90 backdrop-blur-md sticky top-0 z-40 border-b border-[#1a2e22]">
        <h1 class="text-xl font-black text-slate-100 tracking-tight flex items-center gap-2">
          <span>TrackEzy</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 font-normal">{{ currentTabName }}</span>
        </h1>
        <div class="flex items-center gap-2">
          <button @click="fetchData" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-slate-300 active:scale-95 transition" :disabled="loading">
            <i class="fa-solid fa-rotate text-xs" :class="{'fa-spin': loading}"></i>
          </button>
          <button @click="lockApp" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400 active:scale-95 transition"><i class="fa-solid fa-lock text-xs"></i></button>
        </div>
      </header>

      <!-- 主内容区 Main -->
      <main class="p-4 space-y-4 flex-1 pb-24 overflow-y-auto">

        <!-- 1. OVERVIEW TAB -->
        <section v-if="activeTab === 'overview'" class="space-y-4">
          <div class="forest-card rounded-3xl p-5 relative overflow-hidden space-y-3 bg-gradient-to-br from-[#132219] to-[#0d1711] shadow-2xl">
            <div class="flex justify-between items-center text-xs text-slate-400 font-medium">
              <span>净资产总额 (Net Worth)</span>
              <span class="text-[10px] text-amber-400 font-serif-num">1 USD = {{ usdFxRate }} MYR</span>
            </div>
            
            <div class="text-2xl font-bold tracking-tight text-white flex items-baseline gap-1.5">
              <span class="text-lg font-bold text-amber-400">RM</span>
              <span class="font-serif-num text-3xl text-slate-100 truncate">{{ formatNumber(displayedNetWorth) }}</span>
            </div>

            <div v-if="monthlyDiff" class="text-xs flex items-center justify-between bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
              <span class="text-slate-400">相比上月快照:</span>
              <span class="font-serif-num font-bold" :class="monthlyDiff.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                {{ monthlyDiff.amount >= 0 ? '+' : '' }}RM {{ formatNumber(monthlyDiff.amount) }} ({{ monthlyDiff.pct >= 0 ? '+' : '' }}{{ monthlyDiff.pct }}%)
              </span>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button @click="useTP = false" :class="!useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-1.5 rounded-xl text-xs font-bold border transition">按当前市值</button>
              <button @click="useTP = true" :class="useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-1.5 rounded-xl text-xs font-bold border transition">按目标价 TP</button>
            </div>

            <div class="grid grid-cols-2 gap-y-2 gap-x-3 pt-2 border-t border-[#1a2e22] text-xs">
              <div class="flex justify-between items-center"><span class="text-blue-400">● 现金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.cash) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-blue-300">● 银行存款</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.bank) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-amber-400">● 虚拟黄金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.paperGold) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-amber-300">● 实体黄金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.physicalGold) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-rose-400">● 股票</span><span class="font-serif-num font-bold">RM {{ formatNumber(useTP ? totals.stockTP : totals.stockMarket) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-purple-400">● 公积金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.epf) }}</span></div>
            </div>

            <button @click="openSnapshotModal" class="w-full btn-gold-border font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center gap-2 active:scale-98 transition">
              <i class="fa-solid fa-camera"></i> 手动记录历史快照 
            </button>
          </div>

          <!-- 历史快照列表 -->
          <div class="space-y-2 pt-2">
            <div class="sticky top-14 z-30 bg-[#090f0b]/95 backdrop-blur-md py-2 px-1 text-xs text-slate-400 font-bold border-b border-[#1a2e22] flex justify-between items-center">
              <span>📜 历史快照列表</span>
              <span class="text-[10px] text-slate-500">点击查看分类明细</span>
            </div>
            
            <div class="space-y-2 pt-1">
              <div v-for="h in groupedHistoryList" :key="h.date + h.remarkBase" @click="openHistoryDetail(h)" class="forest-card rounded-2xl p-3.5 flex justify-between items-center cursor-pointer active:scale-98 transition text-xs">
                <div>
                  <div class="font-bold text-slate-200 font-mono">{{ cleanDate(h.date) }}</div>
                  <div class="text-[10px] text-amber-400/80 mt-0.5">{{ h.remarkBase || '月度快照' }}</div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-slate-100 text-sm">RM {{ formatNumber(h.marketVal) }}</div>
                  <div class="font-serif-num text-[10px] text-amber-300 mt-0.5">TP: RM {{ formatNumber(h.tpVal) }}</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 2. CASH TAB -->
        <section v-if="activeTab === 'cash'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3 bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-slate-400">现金与存款总计</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.cash + totals.bank) }}</div>
              </div>
              <button @click="showAddCashModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增账户</button>
            </div>
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openCashTxnModal('Deposit')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">➕ 存款</button>
              <button @click="openCashTxnModal('Withdrawal')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">➖ 提款</button>
              <button @click="openCashTxnModal('Transfer')" class="bg-blue-600/20 text-blue-300 border border-blue-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">🔄 转账</button>
            </div>
          </div>

          <!-- 现金账户 -->
          <div class="space-y-2">
            <div class="text-xs font-bold text-slate-300 px-1">💵 现金 (Cash)</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Cash')" :key="acc.Account_ID" class="forest-card rounded-2xl p-3.5 flex justify-between items-center">
              <div @click="openTxnHistoryModal(acc)" class="cursor-pointer flex-1">
                <div class="font-bold text-sm text-slate-100">{{ acc.Account_Nickname }}</div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看交易明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
                <button @click="deleteCashAccount(acc)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>

          <!-- 银行账户 -->
          <div class="space-y-2 pt-2">
            <div class="text-xs font-bold text-slate-300 px-1">🏦 银行存款户口</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Bank')" :key="acc.Account_ID" class="forest-card rounded-2xl p-3.5 flex justify-between items-center">
              <div @click="openTxnHistoryModal(acc)" class="cursor-pointer flex-1">
                <div class="font-bold text-sm text-slate-100">{{ acc.Bank_Name }} <span class="text-xs font-normal text-slate-400">({{ acc.Account_Nickname }})</span></div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看交易明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
                <button @click="deleteCashAccount(acc)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 3. GOLD TAB -->
        <section v-if="activeTab === 'gold'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3 bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-amber-400 font-medium">黄金总市值</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.gold) }}</div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openGoldTxnModal('buy')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">➕ 买入黄金</button>
              <button @click="openGoldTxnModal('sell')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">➖ 卖出黄金</button>
            </div>
          </div>

          <div class="space-y-3">
            <div v-for="g in goldList" :key="g.Type" class="forest-card rounded-2xl p-4 space-y-3">
              <div class="flex justify-between items-center">
                <div>
                  <div class="font-bold text-sm text-slate-100">{{ g.Type === 'Paper' ? '🪙 虚拟黄金 (Paper Gold)' : '🥇 实体黄金 (Gold Bar)' }}</div>
                  <div class="text-[10px] text-slate-400 mt-0.5 font-serif-num">{{ g.Grams || 0 }} 克 · 买入均价 RM {{ formatNumber(g.Avg_Price) }}/g</div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-amber-300 text-base">RM {{ formatNumber(getGoldMarketVal(g)) }}</div>
                  <div :class="getGoldPL(g) >= 0 ? 'text-emerald-400' : 'text-rose-400'" class="text-[11px] font-bold font-serif-num">
                    {{ getGoldPL(g) >= 0 ? '+' : '' }}RM {{ formatNumber(getGoldPL(g)) }} ({{ getGoldPLPct(g) }}%)
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-xs">
                <span class="text-slate-400 font-serif-num">当前市价: RM {{ formatNumber(g.Market_Price_Per_Gram || g.Avg_Price) }}/g</span>
                <button @click="promptUpdateGoldPrice(g)" class="btn-gold-border px-2.5 py-1 rounded-xl text-[11px] font-bold">修改当前市价 ✏️</button>
              </div>

              <div class="pt-2 border-t border-[#1a2e22] space-y-2">
                <div class="text-[11px] font-bold text-slate-300">📜 交易历史</div>
                <div v-for="t in getGoldTxnsByType(g.Type)" :key="t.Txn_ID" class="bg-[#0d1711] border border-[#1f3329] rounded-xl p-2.5 flex justify-between items-center text-xs">
                  <div>
                    <div class="font-bold text-slate-200">{{ t.Txn_Type === 'buy' ? '➕ 买入' : '➖ 卖出' }} · {{ cleanDate(t.Date) }}</div>
                    <div class="text-[10px] text-slate-400 font-serif-num">{{ t.Grams }} 克 @ RM {{ formatNumber(t.Price) }}/g</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <div class="text-right font-serif-num font-bold text-amber-300">RM {{ formatNumber(t.Grams * t.Price) }}</div>
                    <button @click="openEditGoldTxn(t)" class="text-amber-400 text-[10px] hover:underline">编辑</button>
                    <button @click="deleteGoldTxn(t)" class="text-rose-400 text-[10px] hover:underline">删除</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 4. EPF TAB -->
        <section v-if="activeTab === 'epf'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3 bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-purple-400">公积金总额</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.epf) }}</div>
              </div>
              <button @click="showAddEPFAccModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增账户</button>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openEPFTxnModalAction('Deposit')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">➕ 供款/利息</button>
              <button @click="openEPFTxnModalAction('Withdrawal')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold active:scale-95 transition">➖ 提款</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div v-for="fund in epfData" :key="fund.Account_Key" class="forest-card rounded-2xl p-4 flex justify-between items-center">
              <div @click="openEPFHistoryModal(fund)" class="cursor-pointer flex-1">
                <span class="text-[9px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">{{ fund.Category }}</span>
                <div class="font-bold text-slate-100 text-base mt-1.5">{{ fund.Fund_Name }}</div>
                <div class="text-[10px] text-purple-300/80 mt-0.5">点击查看交易明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100 text-base">RM {{ formatNumber(fund.Current_Balance) }}</div>
                <button @click="deleteEPFAccount(fund)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 5. STOCKS TAB -->
        <section v-if="activeTab === 'stocks'" class="space-y-3">
          <div class="sticky top-14 z-30 forest-card rounded-3xl p-4 space-y-3 backdrop-blur-md bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98 border border-[#2e4e3b] shadow-xl">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-emerald-400 font-medium">📈 股票总市值</div>
                <div class="font-serif-num text-2xl font-bold text-white mt-0.5">RM {{ formatNumber(totals.stockMarket) }}</div>
              </div>
              <div class="flex gap-2">
                <button @click="syncUsdStockPrices" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5" :disabled="loading">
                  <i class="fa-solid fa-rotate" :class="{'fa-spin': updatingPrices}"></i> 更新美股
                </button>
                <button @click="showNewStockModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22] text-xs">
              <div class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
                <div class="text-[10px] text-slate-400">总未实现盈亏</div>
                <div class="font-serif-num font-bold text-sm mt-0.5" :class="totalUnrealizedPL >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                  {{ totalUnrealizedPL >= 0 ? '+' : '' }}RM {{ formatNumber(totalUnrealizedPL) }}
                </div>
              </div>
              <div @click="showDividendSummaryModal = true" class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329] cursor-pointer active:scale-98 transition">
                <div class="text-[10px] text-amber-400 flex justify-between items-center"><span>💰 今年累计股息</span><span class="text-[9px]">年度对比 ➔</span></div>
                <div class="font-serif-num font-bold text-amber-300 text-sm mt-0.5">
                  RM {{ formatNumber(currentYearDividendsSum) }}
                </div>
              </div>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-xs">
              <div class="flex items-center gap-2">
                <span class="text-slate-400">排序:</span>
                <select v-model="stockSortMode" class="bg-[#132219] border border-[#2e4e3b] text-amber-300 rounded-lg px-2 py-1 text-xs outline-none">
                  <option value="default">默认</option>
                  <option value="valueDesc">市值由高到低</option>
                  <option value="valueAsc">市值由低到高</option>
                  <option value="plDesc">赚幅由高至低</option>
                  <option value="plAsc">赚幅由低到高</option>
                </select>
              </div>
              <span class="text-[10px] text-slate-500 font-serif-num">1 USD = {{ usdFxRate }} MYR</span>
            </div>
          </div>

          <div class="space-y-2.5 pt-1">
            <div v-for="s in sortedStockData" :key="s.Ticker" class="forest-card rounded-2xl p-4 space-y-2 transition">
              <div @click="openStockDetail(s)" class="flex justify-between items-start cursor-pointer">
                <div>
                  <div class="font-extrabold text-base text-white flex items-center gap-2">
                    {{ s.Stock_Name }}
                  </div>
                  <div class="text-xs text-slate-400 mt-0.5 font-serif-num">
                    {{ formatTickerDisplay(s.Ticker) }} · <span class="text-amber-400">{{ s.Market || '大马股' }}</span>

        const cashTxns = ref(JSON.parse(localStorage.getItem('trackezy_cash_txns') || '[]'));
        const goldList = ref(JSON.parse(localStorage.getItem('trackezy_gold') || '[]'));
        const goldTxns = ref(JSON.parse(localStorage.getItem('trackezy_gold_txns') || '[]'));
        const epfData = ref(JSON.parse(localStorage.getItem('trackezy_epf') || '[]'));
        const epfTxns = ref(JSON.parse(localStorage.getItem('trackezy_epf_txns') || '[]'));
        const stockData = ref(JSON.parse(localStorage.getItem('trackezy_stocks') || '[]'));
        const stockTxnsData = ref(JSON.parse(localStorage.getItem('trackezy_stock_txns') || '[]'));
        const dividendsData = ref(JSON.parse(localStorage.getItem('trackezy_dividends') || '[]'));

        // Navigation Tabs
        const tabs = [
          { id: 'overview', name: '总览', icon: 'fa-solid fa-chart-pie' },
          { id: 'cash', name: '现金', icon: 'fa-solid fa-wallet' },
          { id: 'gold', name: '黄金', icon: 'fa-solid fa-coins' },
          { id: 'epf', name: '公积金', icon: 'fa-solid fa-[#9333ea] fa-piggy-bank' },
          { id: 'stocks', name: '股票', icon: 'fa-solid fa-chart-line' },
          { id: 'settings', name: '设置', icon: 'fa-solid fa-gear' },
        ];

        const currentTabName = computed(() => tabs.find(t => t.id === activeTab.value)?.name || 'TrackEzy');

        // Modals Visibility Control
        const showDividendSummaryModal = ref(false);
        const showHistoryDetailModal = ref(false);
        const showSnapshotModal = ref(false);
        const showAddCashModal = ref(false);
        const showCashTxnModal = ref(false);
        const showTxnHistoryModal = ref(false);
        const showEditCashTxnModal = ref(false);
        const showGoldTxnModal = ref(false);
        const showEditGoldTxnModal = ref(false);
        const showAddEPFAccModal = ref(false);
        const showEPFTxnModal = ref(false);
        const showEPFHistoryModal = ref(false);
        const showEditEPFTxnModal = ref(false);
        const showNewStockModal = ref(false);
        const showStockDetailModal = ref(false);
        const showNewStockTxnModal = ref(false);
        const showAddDividendModal = ref(false);
        const showEditStockTxnModal = ref(false);
        const showEditDividendModal = ref(false);

        // Forms State
        const snapshotForm = ref({ date: new Date().toISOString().slice(0, 10), remark: '' });
        const selectedHistoryGroup = ref(null);
        
        const newCashForm = ref({ Type: 'Cash', Bank_Name: '', Account_Nickname: '', Initial_Balance: 0 });
        const cashTxnForm = ref({ Account_ID: '', Target_Account_ID: '', Txn_Type: 'Deposit', Amount: 0, Date: new Date().toISOString().slice(0, 10), Remarks: '' });
        const selectedAccountForHistory = ref(null);
        const editCashTxnForm = ref({ Txn_ID: '', Amount: 0, Date: '', Remarks: '' });

        const goldTxnForm = ref({ Gold_Type: 'Paper', Txn_Type: 'buy', Grams: 0, Price: 0, Date: new Date().toISOString().slice(0, 10) });
        const editGoldTxnForm = ref({ Txn_ID: '', Grams: 0, Price: 0, Date: '' });

        const newEPFAccForm = ref({ Category: 'Akaun Persaraan', Fund_Name: '', Initial_Balance: 0 });
        const epfTxnForm = ref({ Account_Key: '', Txn_Type: 'Deposit', Amount: 0, Date: new Date().toISOString().slice(0, 10), Remarks: '' });
        const selectedEPFAccForHistory = ref(null);
        const editEPFTxnForm = ref({ Txn_ID: '', Amount: 0, Date: '', Remarks: '' });

        const newStockForm = ref({ Ticker: '', Stock_Name: '', Currency: 'MYR', Target_Price: 0 });
        const selectedStockDetail = ref(null);
        const targetStockForTxn = ref(null);
        const stockTxnForm = ref({ Ticker: '', Txn_Type: 'buy', Shares: 0, Price: 0, Account_ID: '', Date: new Date().toISOString().slice(0, 10) });
        const dividendForm = ref({ Ticker: '', Amount_MYR: 0, Account_ID: '', Date: new Date().toISOString().slice(0, 10), Remarks: '' });
        
        const editStockTxnForm = ref({ Txn_ID: '', Shares: 0, Price: 0, Total_MYR: 0, Date: '' });
        const editDividendForm = ref({ Div_ID: '', Amount_MYR: 0, Date: '', Remarks: '' });

        // Helper Methods
        const formatNumber = (val) => {
          if (val === undefined || val === null || isNaN(val)) return '0.00';
          return Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const cleanDate = (d) => {
          if (!d) return '';
          return String(d).slice(0, 10);
        };

        const formatTickerDisplay = (t) => t ? String(t).replace('.KL', '') : '';

        // PIN & Lock
        const pressPin = (n) => {
          if (pinInput.value.length < 6) {
            pinInput.value += String(n);
            if (pinInput.value.length === 6) {
              if (pinInput.value === savedPin.value) {
                isLocked.value = false;
                pinInput.value = '';
              } else {
                alert('PIN 码错误，请重试！');
                pinInput.value = '';
              }
            }
          }
        };

        const lockApp = () => { isLocked.value = true; };

        const saveNewPin = () => {
          if (newPinInput.value.length !== 6) {
            alert('PIN 码必须为 6 位数字');
            return;
          }
          savedPin.value = newPinInput.value;
          localStorage.setItem('trackezy_pin', newPinInput.value);
          newPinInput.value = '';
          alert('解锁 PIN 码更新成功！');
        };

        const saveFxRate = () => {
          localStorage.setItem('trackezy_fx', usdFxRate.value);
          alert('USD 汇率更新成功！');
        };

        const clearLocalCache = () => {
          if (confirm('确认清除所有本地缓存并重新下载云端数据？')) {
            localStorage.clear();
            location.reload();
          }
        };

        // Calculations & Aggregations
        const totals = computed(() => {
          const cash = cashAccounts.value.filter(a => a.Type === 'Cash').reduce((s, a) => s + (Number(a.Current_Balance) || 0), 0);
          const bank = cashAccounts.value.filter(a => a.Type === 'Bank').reduce((s, a) => s + (Number(a.Current_Balance) || 0), 0);
          
          let paperGold = 0, physicalGold = 0;
          goldList.value.forEach(g => {
            const val = (Number(g.Grams) || 0) * (Number(g.Market_Price_Per_Gram) || Number(g.Avg_Price) || 0);
            if (g.Type === 'Paper') paperGold += val;
            else physicalGold += val;
          });

          const epf = epfData.value.reduce((s, e) => s + (Number(e.Current_Balance) || 0), 0);

          let stockMarket = 0, stockTP = 0;
          stockData.value.forEach(s => {
            const shares = Number(s.Total_Shares) || 0;
            const curPrice = Number(s.Current_Price) || 0;
            const tpPrice = Number(s.Target_Price) || curPrice;
            const fx = s.Currency === 'USD' ? usdFxRate.value : 1;

            stockMarket += shares * curPrice * fx;
            stockTP += shares * tpPrice * fx;
          });

          return {
            cash, bank, paperGold, physicalGold,
            gold: paperGold + physicalGold,
            epf, stockMarket, stockTP,
            netWorthMarket: cash + bank + paperGold + physicalGold + epf + stockMarket,
            netWorthTP: cash + bank + paperGold + physicalGold + epf + stockTP
          };
        });

        const displayedNetWorth = computed(() => useTP.value ? totals.value.netWorthTP : totals.value.netWorthMarket);

        // Grouped History
        const groupedHistoryList = computed(() => {
          const groups = {};
          historyList.value.forEach(h => {
            const key = cleanDate(h.Date) + '_' + (h.Remarks || '');
            if (!groups[key]) {
              groups[key] = { date: h.Date, remarkBase: h.Remarks || '', marketVal: 0, tpVal: 0, items: [] };
            }
            groups[key].items.push(h);
            const val = Number(h.Total_Value) || 0;
            groups[key].marketVal += val;
            groups[key].tpVal += val; 
          });
          return Object.values(groups).sort((a, b) => new Date(b.date) - new Date(a.date));
        });

        const monthlyDiff = computed(() => {
          if (groupedHistoryList.value.length < 2) return null;
          const latest = groupedHistoryList.value[0].marketVal;
          const prev = groupedHistoryList.value[1].marketVal;
          const diff = latest - prev;
          const pct = prev > 0 ? ((diff / prev) * 100).toFixed(2) : '0.00';
          return { amount: diff, pct };
        });

        // Stocks Logic
        const sortedStockData = computed(() => {
          const list = [...stockData.value];
          if (stockSortMode.value === 'valueDesc') {
            return list.sort((a, b) => getStockMarketValMYR(b) - getStockMarketValMYR(a));
          } else if (stockSortMode.value === 'valueAsc') {
            return list.sort((a, b) => getStockMarketValMYR(a) - getStockMarketValMYR(b));
          } else if (stockSortMode.value === 'plDesc') {
            return list.sort((a, b) => getStockUnrealizedPL(b) - getStockUnrealizedPL(a));
          } else if (stockSortMode.value === 'plAsc') {
            return list.sort((a, b) => getStockUnrealizedPL(a) - getStockUnrealizedPL(b));
          }
          return list;
        });

        const getStockMarketValMYR = (s) => {
          const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
          return (Number(s.Total_Shares) || 0) * (Number(s.Current_Price) || 0) * fx;
        };

        const getStockUnrealizedPL = (s) => {
          const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
          const cost = (Number(s.Total_Shares) || 0) * (Number(s.Avg_Cost) || 0) * fx;
          return getStockMarketValMYR(s) - cost;
        };

        const getStockUnrealizedPLPct = (s) => {
          const fx = s.Currency === 'USD' ? usdFxRate.value : 1;
          const cost = (Number(s.Total_Shares) || 0) * (Number(s.Avg_Cost) || 0) * fx;
          if (cost <= 0) return '0.00';
          return ((getStockUnrealizedPL(s) / cost) * 100).toFixed(2);
        };

        const totalUnrealizedPL = computed(() => stockData.value.reduce((s, item) => s + getStockUnrealizedPL(item), 0));

        const yearlyDividendsMap = computed(() => {
          const map = {};
          dividendsData.value.forEach(d => {
            const yr = new Date(d.Date).getFullYear();
            map[yr] = (map[yr] || 0) + (Number(d.Amount_MYR) || 0);
          });
          return map;
        });

        const currentYearDividendsSum = computed(() => {
          const curYr = new Date().getFullYear();
          return yearlyDividendsMap.value[curYr] || 0;
        });

        // Gold Helpers
        const getGoldMarketVal = (g) => (Number(g.Grams) || 0) * (Number(g.Market_Price_Per_Gram) || Number(g.Avg_Price) || 0);
        const getGoldPL = (g) => {
          const cost = (Number(g.Grams) || 0) * (Number(g.Avg_Price) || 0);
          return getGoldMarketVal(g) - cost;
        };
        const getGoldPLPct = (g) => {
          const cost = (Number(g.Grams) || 0) * (Number(g.Avg_Price) || 0);
          if (cost <= 0) return '0.00';
          return ((getGoldPL(g) / cost) * 100).toFixed(2);
        };
        const getGoldTxnsByType = (type) => goldTxns.value.filter(t => t.Gold_Type === type);

        // API Actions
        const fetchData = async () => {
          loading.value = true;
          try {
            const res = await fetch(API_URL + '?action=getAllData');
            const data = await res.json();
            if (data) {
              if (data.history) { historyList.value = data.history; localStorage.setItem('trackezy_history', JSON.stringify(data.history)); }
              if (data.cashAccounts) { cashAccounts.value = data.cashAccounts; localStorage.setItem('trackezy_cash_acc', JSON.stringify(data.cashAccounts)); }
              if (data.cashTxns) { cashTxns.value = data.cashTxns; localStorage.setItem('trackezy_cash_txns', JSON.stringify(data.cashTxns)); }
              if (data.gold) { goldList.value = data.gold; localStorage.setItem('trackezy_gold', JSON.stringify(data.gold)); }
              if (data.goldTxns) { goldTxns.value = data.goldTxns; localStorage.setItem('trackezy_gold_txns', JSON.stringify(data.goldTxns)); }
              if (data.epf) { epfData.value = data.epf; localStorage.setItem('trackezy_epf', JSON.stringify(data.epf)); }
              if (data.epfTxns) { epfTxns.value = data.epfTxns; localStorage.setItem('trackezy_epf_txns', JSON.stringify(data.epfTxns)); }
              if (data.stocks) { stockData.value = data.stocks; localStorage.setItem('trackezy_stocks', JSON.stringify(data.stocks)); }
              if (data.stockTxns) { stockTxnsData.value = data.stockTxns; localStorage.setItem('trackezy_stock_txns', JSON.stringify(data.stockTxns)); }
              if (data.dividends) { dividendsData.value = data.dividends; localStorage.setItem('trackezy_dividends', JSON.stringify(data.dividends)); }
            }
          } catch (e) {
            console.error(e);
          } finally {
            loading.value = false;
          }
        };

        const sendPost = async (action, payload) => {
          loading.value = true;
          try {
            await fetch(API_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action, ...payload })
            });
            setTimeout(fetchData, 1000);
          } catch (e) {
            alert('提交失败: ' + e.message);
          } finally {
            loading.value = false;
          }
        };

        // Submissions & Modal Triggers
        const openSnapshotModal = () => { showSnapshotModal.value = true; };
        const submitSnapshot = () => {
          sendPost('addSnapshot', { Date: snapshotForm.value.date, Remarks: snapshotForm.value.remark });
          showSnapshotModal.value = false;
        };

        const openHistoryDetail = (h) => {
          selectedHistoryGroup.value = h;
          showHistoryDetailModal.value = true;
        };

        const submitAddCashAccount = () => {
          sendPost('addCashAccount', newCashForm.value);
          showAddCashModal.value = false;
        };

        const openCashTxnModal = (type) => {
          cashTxnForm.value.Txn_Type = type;
          if (cashAccounts.value.length > 0) cashTxnForm.value.Account_ID = cashAccounts.value[0].Account_ID;
          showCashTxnModal.value = true;
        };

        const submitCashTxn = () => {
          sendPost('addCashTxn', cashTxnForm.value);
          showCashTxnModal.value = false;
        };

        const currentAccountTxns = computed(() => {
          if (!selectedAccountForHistory.value) return [];
          return cashTxns.value.filter(t => t.Account_ID === selectedAccountForHistory.value.Account_ID);
        });

        const openTxnHistoryModal = (acc) => {
          selectedAccountForHistory.value = acc;
          showTxnHistoryModal.value = true;
        };

        const openEditCashTxn = (t) => {
          editCashTxnForm.value = { Txn_ID: t.Txn_ID, Amount: t.Amount, Date: cleanDate(t.Date), Remarks: t.Remarks || '' };
          showEditCashTxnModal.value = true;
        };

        const submitEditCashTxn = () => {
          sendPost('updateCashTxn', editCashTxnForm.value);
          showEditCashTxnModal.value = false;
        };

        const deleteCashTxn = (t) => {
          if (confirm('确定删除此条现金变动记录？')) sendPost('deleteCashTxn', { Txn_ID: t.Txn_ID });
        };

        const deleteCashAccount = (acc) => {
          if (confirm(`确定删除账户 [${acc.Account_Nickname}]？`)) sendPost('deleteCashAccount', { Account_ID: acc.Account_ID });
        };

        const openGoldTxnModal = (type) => {
          goldTxnForm.value.Txn_Type = type;
          showGoldTxnModal.value = true;
        };

        const submitGoldTxn = () => {
          sendPost('addGoldTxn', goldTxnForm.value);
          showGoldTxnModal.value = false;
        };

        const promptUpdateGoldPrice = (g) => {
          const p = prompt(`修改 ${g.Type} 当前黄金市价 (RM/g):`, g.Market_Price_Per_Gram || g.Avg_Price);
          if (p) sendPost('updateGoldMarketPrice', { Type: g.Type, Price: parseFloat(p) });
        };

        const openEditGoldTxn = (t) => {
          editGoldTxnForm.value = { Txn_ID: t.Txn_ID, Grams: t.Grams, Price: t.Price, Date: cleanDate(t.Date) };
          showEditGoldTxnModal.value = true;
        };

        const submitEditGoldTxn = () => {
          sendPost('updateGoldTxn', editGoldTxnForm.value);
          showEditGoldTxnModal.value = false;
        };

        const deleteGoldTxn = (t) => {
          if (confirm('确定删除此黄金交易？')) sendPost('deleteGoldTxn', { Txn_ID: t.Txn_ID });
        };

        const submitAddEPFAccount = () => {
          sendPost('addEPFAccount', newEPFAccForm.value);
          showAddEPFAccModal.value = false;
        };

        const openEPFTxnModalAction = (type) => {
          epfTxnForm.value.Txn_Type = type;
          if (epfData.value.length > 0) epfTxnForm.value.Account_Key = epfData.value[0].Account_Key;
          showEPFTxnModal.value = true;
        };

        const submitEPFTxn = () => {
          sendPost('addEPFTxn', epfTxnForm.value);
          showEPFTxnModal.value = false;
        };

        const currentEPFTxns = computed(() => {
          if (!selectedEPFAccForHistory.value) return [];
          return epfTxns.value.filter(t => t.Account_Key === selectedEPFAccForHistory.value.Account_Key);
        });

        const openEPFHistoryModal = (fund) => {
          selectedEPFAccForHistory.value = fund;
          showEPFHistoryModal.value = true;
        };

        const openEditEPFTxn = (t) => {
          editEPFTxnForm.value = { Txn_ID: t.Txn_ID, Amount: t.Amount, Date: cleanDate(t.Date), Remarks: t.Remarks || '' };
          showEditEPFTxnModal.value = true;
        };

        const submitEditEPFTxn = () => {
          sendPost('updateEPFTxn', editEPFTxnForm.value);
          showEditEPFTxnModal.value = false;
        };

        const deleteEPFTxn = (t) => {
          if (confirm('确认删除此公积金记录？')) sendPost('deleteEPFTxn', { Txn_ID: t.Txn_ID });
        };

        const deleteEPFAccount = (fund) => {
          if (confirm(`确认删除 [${fund.Fund_Name}] 及其所有记录？`)) sendPost('deleteEPFAccount', { Account_Key: fund.Account_Key });
        };

        const submitNewStock = () => {
          sendPost('addStock', newStockForm.value);
          showNewStockModal.value = false;
        };

        const openStockDetail = (s) => {
          selectedStockDetail.value = s;
          showStockDetailModal.value = true;
        };

        const saveStockCurrentPrice = (s) => {
          sendPost('updateStockCurrentPrice', { Ticker: s.Ticker, Price: parseFloat(s.Current_Price) });
        };

        const saveStockTargetPrice = (s) => {
          sendPost('updateStockTargetPrice', { Ticker: s.Ticker, Price: parseFloat(s.Target_Price) });
        };

        const deleteStockCard = (s) => {
          if (confirm(`确定删除股票关注 [${s.Stock_Name}]？`)) sendPost('deleteStock', { Ticker: s.Ticker });
        };

        const getStockTxns = (ticker) => stockTxnsData.value.filter(t => t.Ticker === ticker);
        const getStockDividends = (ticker) => dividendsData.value.filter(d => d.Ticker === ticker);

        const openNewStockTxnModal = (s) => {
          targetStockForTxn.value = s;
          stockTxnForm.value.Ticker = s.Ticker;
          stockTxnForm.value.Price = s.Current_Price || 0;
          showNewStockTxnModal.value = true;
        };

        const submitStockTxn = () => {
          sendPost('addStockTxn', stockTxnForm.value);
          showNewStockTxnModal.value = false;
        };

        const openAddDividendModal = (s) => {
          targetStockForTxn.value = s;
          dividendForm.value.Ticker = s.Ticker;
          showAddDividendModal.value = true;
        };

        const submitDividend = () => {
          sendPost('addDividend', dividendForm.value);
          showAddDividendModal.value = false;
        };

        const openEditStockTxn = (t) => {
          editStockTxnForm.value = { Txn_ID: t.Txn_ID, Shares: t.Shares, Price: t.Price, Total_MYR: t.Total_MYR, Date: cleanDate(t.Date) };
          showEditStockTxnModal.value = true;
        };

        const submitEditStockTxn = () => {
          sendPost('updateStockTxn', editStockTxnForm.value);
          showEditStockTxnModal.value = false;
        };

        const deleteStockTxn = (t) => {
          if (confirm('确定删除此股票买卖交易？')) sendPost('deleteStockTxn', { Txn_ID: t.Txn_ID });
        };

        const openEditDividend = (d) => {
          editDividendForm.value = { Div_ID: d.Div_ID, Amount_MYR: d.Amount_MYR, Date: cleanDate(d.Date), Remarks: d.Remarks || '' };
          showEditDividendModal.value = true;
        };

        const submitEditDividend = () => {
          sendPost('updateDividend', editDividendForm.value);
          showEditDividendModal.value = false;
        };

        const deleteDividend = (d) => {
          if (confirm('确定删除此股息记录？')) sendPost('deleteDividend', { Div_ID: d.Div_ID });
        };

        const syncUsdStockPrices = async () => {
          updatingPrices.value = true;
          await fetchData();
          updatingPrices.value = false;
        };

        onMounted(() => {
          fetchData();
        });

        return {
          activeTab, tabs, currentTabName, isLocked, pinInput, pressPin, lockApp, newPinInput, saveNewPin,
          loading, updatingPrices, usdFxRate, saveFxRate, clearLocalCache,
          useTP, stockSortMode,
          totals, displayedNetWorth, monthlyDiff, groupedHistoryList,
          
          // Modals state
          showDividendSummaryModal, showHistoryDetailModal, showSnapshotModal, showAddCashModal, showCashTxnModal,
          showTxnHistoryModal, showEditCashTxnModal, showGoldTxnModal, showEditGoldTxnModal, showAddEPFAccModal,
          showEPFTxnModal, showEPFHistoryModal, showEditEPFTxnModal, showNewStockModal, showStockDetailModal,
          showNewStockTxnModal, showAddDividendModal, showEditStockTxnModal, showEditDividendModal,

          // Data & Forms
          snapshotForm, selectedHistoryGroup, newCashForm, cashTxnForm, selectedAccountForHistory, editCashTxnForm,
          goldTxnForm, editGoldTxnForm, newEPFAccForm, epfTxnForm, selectedEPFAccForHistory, editEPFTxnForm,
          newStockForm, selectedStockDetail, targetStockForTxn, stockTxnForm, dividendForm, editStockTxnForm, editEditDividendForm: editDividendForm,

          // Data collections
          cashAccounts, goldList, epfData, stockData, sortedStockData, totalUnrealizedPL, currentYearDividendsSum, yearlyDividendsMap,
          currentAccountTxns, currentEPFTxns,

          // Helper methods
          formatNumber, cleanDate, formatTickerDisplay, getGoldMarketVal, getGoldPL, getGoldPLPct, getGoldTxnsByType,
          getStockMarketValMYR, getStockUnrealizedPL, getStockUnrealizedPLPct, getStockTxns, getStockDividends,

          // Event handlers
          fetchData, openSnapshotModal, submitSnapshot, openHistoryDetail, submitAddCashAccount, openCashTxnModal,
          submitCashTxn, openTxnHistoryModal, openEditCashTxn, submitEditCashTxn, deleteCashTxn, deleteCashAccount,
          openGoldTxnModal, submitGoldTxn, promptUpdateGoldPrice, openEditGoldTxn, submitEditGoldTxn, deleteGoldTxn,
          submitAddEPFAccount, openEPFTxnModalAction, submitEPFTxn, openEPFHistoryModal, openEditEPFTxn, submitEditEPFTxn,
          deleteEPFTxn, deleteEPFAccount, submitNewStock, openStockDetail, saveStockCurrentPrice, saveStockTargetPrice,
          deleteStockCard, openNewStockTxnModal, submitStockTxn, openAddDividendModal, submitDividend, openEditStockTxn,
          submitEditStockTxn, deleteStockTxn, openEditDividend, submitEditDividend, deleteDividend, syncUsdStockPrices
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
