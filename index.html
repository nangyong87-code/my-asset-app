<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackEzy Asset Tracker</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    [v-cloak] { display: none !important; }
    body { background-color: #0b120e; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-serif-num { font-family: 'Playfair Display', serif; }
    .forest-card { background: linear-gradient(145deg, #132219 0%, #0d1711 100%); border: 1px solid rgba(46, 78, 59, 0.4); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
    .btn-gold-border { background: rgba(19, 34, 25, 0.8); border: 1px solid #9a7b38; color: #d4af37; }
    .input-dark { background-color: #090f0b; border: 1px solid #1f3329; color: white; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.75rem; width: 100%; }
  </style>
</head>
<body class="min-h-screen pb-28 antialiased">

  <div id="app" v-cloak class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-[#090f0b] border-x border-[#1a2e22]">

    <!-- PIN Lock Modal (解锁瞬间触发 fetchData 保证秒级呈现) -->
    <div v-if="isLocked" class="fixed inset-0 z-50 bg-[#090f0b] flex flex-col items-center justify-center p-6 space-y-6">
      <div class="w-16 h-16 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400 text-2xl shadow-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-white tracking-wide">TrackEzy 安全保护</h2>
        <p class="text-xs text-slate-400">请输入解锁 PIN 码</p>
      </div>

      <div class="flex gap-3 my-4">
        <div v-for="i in 6" :key="i" class="w-4 h-4 rounded-full border border-[#2e4e3b]" :class="pinInput.length >= i ? 'bg-amber-400' : 'bg-[#132219]'"></div>
      </div>

      <div class="grid grid-cols-3 gap-4 w-full max-w-xs pt-4">
        <button v-for="n in [1,2,3,4,5,6,7,8,9]" :key="n" @click="pressPin(n)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">{{ n }}</button>
        <button @click="pinInput = ''" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-xs font-bold active:scale-95 flex items-center justify-center mx-auto">清空</button>
        <button @click="pressPin(0)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">0</button>
        <button @click="pinInput = pinInput.slice(0, -1)" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-sm active:scale-95 flex items-center justify-center mx-auto"><i class="fa-solid fa-delete-left"></i></button>
      </div>
    </div>

    <!-- MAIN UI -->
    <template v-else>

      <header class="px-5 pt-6 pb-3 flex justify-between items-center bg-[#090f0b]/80 backdrop-blur-md sticky top-0 z-30 border-b border-[#1a2e22]">
        <h1 class="text-2xl font-black text-slate-100 tracking-tight">{{ currentTabTitle }}</h1>
        <div class="flex items-center gap-2">
          <button @click="fetchData" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-slate-300">
            <i class="fa-solid fa-rotate" :class="{'fa-spin': loading}"></i>
          </button>
          <button @click="lockApp" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400"><i class="fa-solid fa-lock text-xs"></i></button>
        </div>
      </header>

      <main class="p-4 space-y-4 flex-1">

        <!-- OVERVIEW -->
        <section v-if="activeTab === 'overview'" class="space-y-4">
          <div class="forest-card rounded-3xl p-5 relative overflow-hidden space-y-4">
            <div class="text-xs text-slate-400 font-medium">净资产总额</div>
            <div class="text-3xl font-bold tracking-tight text-white flex items-baseline gap-1.5">
              <span class="text-xl font-bold text-slate-200">RM</span>
              <span class="font-serif-num text-3xl sm:text-4xl text-slate-100 truncate">{{ formatNumber(displayedNetWorth) }}</span>
            </div>

            <div v-if="monthlyDiff" class="text-xs flex items-center gap-2 bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
              <span class="text-slate-400">相比上月:</span>
              <span class="font-serif-num font-bold" :class="monthlyDiff.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                {{ monthlyDiff.amount >= 0 ? '+' : '' }}RM {{ formatNumber(monthlyDiff.amount) }} ({{ monthlyDiff.pct >= 0 ? '+' : '' }}{{ monthlyDiff.pct }}%)
              </span>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button @click="useTP = false" :class="!useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-2 rounded-xl text-xs font-bold border">按市值</button>
              <button @click="useTP = true" :class="useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-2 rounded-xl text-xs font-bold border">按目标价 TP</button>
            </div>

            <div class="grid grid-cols-2 gap-y-2.5 gap-x-3 pt-3 border-t border-[#1a2e22] text-xs">
              <div class="flex justify-between items-center"><span class="text-blue-400">● 存款</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.cash) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-blue-300">● 银行存款</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.bank) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-amber-400">● 纸黄金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.paperGold) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-amber-300">● 实体金条</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.physicalGold) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-rose-400">● 股票</span><span class="font-serif-num font-bold">RM {{ formatNumber(useTP ? totals.stockTP : totals.stockMarket) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-purple-400">● EPF/PRS</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.epf) }}</span></div>
            </div>

            <button @click="openSnapshotModal" class="w-full btn-gold-border font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2"><i class="fa-solid fa-camera"></i> 手动记录快照</button>
          </div>

          <div class="space-y-2">
            <div class="text-xs text-slate-400 font-bold px-1">📜 历史结账与快照列表 (点击查看分类详情)</div>
            <div v-for="h in historyList.slice().reverse()" :key="h.Record_Date" @click="openHistoryDetail(h)" class="forest-card rounded-2xl p-3.5 flex justify-between items-center cursor-pointer active:scale-98 transition text-xs">
              <div>
                <div class="font-bold text-slate-200 font-mono">{{ cleanDate(h.Record_Date) }}</div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">{{ (h.Remarks && h.Remarks !== '10688') ? h.Remarks : '月度结账' }} ➔ 点击看分类详情</div>
              </div>
              <div class="font-serif-num font-bold text-slate-100 text-sm">RM {{ formatNumber(h.Total_Net_Worth) }}</div>
            </div>
          </div>
        </section>

        <!-- CASH -->
        <section v-if="activeTab === 'cash'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-slate-400">存款与现金总计</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.cash + totals.bank) }}</div>
              </div>
              <button @click="showAddCashModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增账户</button>
            </div>
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openCashTxnModal('Deposit')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold">➕ 存入</button>
              <button @click="openCashTxnModal('Withdrawal')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold">➖ 提取/支出</button>
              <button @click="openCashTxnModal('Transfer')" class="bg-blue-600/20 text-blue-300 border border-blue-500/30 py-2 rounded-xl text-xs font-bold">🔄 转账</button>
            </div>
          </div>

          <div class="space-y-2">
            <div class="text-xs font-bold text-slate-300 px-1">💵 现金 (Cash)</div>
            <div v-if="cashAccounts.filter(a => a.Type === 'Cash').length === 0" class="text-xs text-slate-500 px-1">暂无现金账户</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Cash')" :key="acc.Account_ID" class="forest-card rounded-2xl p-3.5 flex justify-between items-center">
              <div @click="openTxnHistoryModal(acc)" class="cursor-pointer flex-1">
                <div class="font-bold text-sm text-slate-100">{{ acc.Account_Nickname }}</div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看历史明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
                <button @click="deleteCashAccount(acc)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>

          <div class="space-y-2 pt-2">
            <div class="text-xs font-bold text-slate-300 px-1">🏦 银行存款户口</div>
            <div v-if="cashAccounts.filter(a => a.Type === 'Bank').length === 0" class="text-xs text-slate-500 px-1">暂无银行账户</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Bank')" :key="acc.Account_ID" class="forest-card rounded-2xl p-3.5 flex justify-between items-center">
              <div @click="openTxnHistoryModal(acc)" class="cursor-pointer flex-1">
                <div class="font-bold text-sm text-slate-100">{{ acc.Bank_Name }} <span class="text-xs font-normal text-slate-400">({{ acc.Account_Nickname }})</span></div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看历史明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
                <button @click="deleteCashAccount(acc)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>
        </section>

        <!-- GOLD -->
        <section v-if="activeTab === 'gold'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-amber-400 font-medium">黄金总市值</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.gold) }}</div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openGoldTxnModal('buy')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold">➕ 买入黄金</button>
              <button @click="openGoldTxnModal('sell')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold">➖ 卖出黄金</button>
            </div>
          </div>

          <div class="space-y-3">
            <div v-for="g in goldList" :key="g.Type" class="forest-card rounded-2xl p-4 space-y-3">
              <div class="flex justify-between items-center">
                <div>
                  <div class="font-bold text-sm text-slate-100">{{ g.Type === 'Paper' ? '🪙 纸黄金 (Paper Gold)' : '🥇 实体金条 (Gold Bar)' }}</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">{{ g.Grams || 0 }} 克 · 买入均价 RM {{ formatNumber(g.Avg_Price) }}/g</div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-amber-300 text-base">RM {{ formatNumber(getGoldMarketVal(g)) }}</div>
                  <div :class="getGoldPL(g) >= 0 ? 'text-emerald-400' : 'text-rose-400'" class="text-[11px] font-bold">
                    {{ getGoldPL(g) >= 0 ? '+' : '' }}RM {{ formatNumber(getGoldPL(g)) }} ({{ getGoldPLPct(g) }}%)
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-xs">
                <span class="text-slate-400">当前市价: RM {{ formatNumber(g.Market_Price_Per_Gram || g.Avg_Price) }}/g</span>
                <button @click="promptUpdateGoldPrice(g)" class="btn-gold-border px-2.5 py-1 rounded-xl text-[11px] font-bold">修改当前市价 ✏️</button>
              </div>

              <div class="pt-2 border-t border-[#1a2e22] space-y-2">
                <div class="text-[11px] font-bold text-slate-300">📜 {{ g.Type === 'Paper' ? '纸黄金' : '实体金条' }} 交易历史</div>
                <div v-if="getGoldTxnsByType(g.Type).length === 0" class="text-[10px] text-slate-500 py-2">暂无交易记录</div>
                <div v-for="t in getGoldTxnsByType(g.Type)" :key="t.Txn_ID" class="bg-[#0d1711] border border-[#1f3329] rounded-xl p-2.5 flex justify-between items-center text-xs">
                  <div>
                    <div class="font-bold text-slate-200">{{ t.Txn_Type === 'buy' ? '➕ 买入' : '➖ 卖出' }} · {{ cleanDate(t.Date) }}</div>
                    <div class="text-[10px] text-slate-400">{{ t.Grams }} 克 @ RM {{ formatNumber(t.Price) }}/g</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <div class="text-right font-serif-num font-bold text-amber-300">RM {{ formatNumber(t.Grams * t.Price) }}</div>
                    <button @click="openEditGoldTxn(t)" class="text-amber-400 text-[10px] hover:underline">编辑</button>
                    <button @click="deleteGoldTxn(t)" class="text-rose-400 text-[10px] hover:underline">删除</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- EPF -->
        <section v-if="activeTab === 'epf'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-purple-400">公积金 & PRS 总额</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.epf) }}</div>
              </div>
              <button @click="showAddEPFAccModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增账户</button>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openEPFTxnModalAction('Deposit')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold">➕ 账户供款</button>
              <button @click="openEPFTxnModalAction('Withdrawal')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold">➖ 账户提款</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div v-for="fund in epfData" :key="fund.Account_Key" class="forest-card rounded-2xl p-4 flex justify-between items-center">
              <div @click="openEPFHistoryModal(fund)" class="cursor-pointer flex-1">
                <span class="text-[9px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">{{ fund.Category }}</span>
                <div class="font-bold text-slate-100 text-base mt-1.5">{{ fund.Fund_Name }}</div>
                <div class="text-[10px] text-purple-300/80 mt-0.5">点击查看明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100 text-base">RM {{ formatNumber(fund.Current_Balance) }}</div>
                <button @click="deleteEPFAccount(fund)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>
        </section>

        <!-- STOCKS -->
        <section v-if="activeTab === 'stocks'" class="space-y-3">
          <div class="forest-card rounded-3xl p-4 space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-emerald-400 font-medium">📈 股票持仓总市值</div>
                <div class="font-serif-num text-2xl font-bold text-white mt-0.5">RM {{ formatNumber(totals.stockMarket) }}</div>
              </div>
              <div class="flex gap-2">
                <button @click="syncUsdStockPrices" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5" :disabled="loading">
                  <i class="fa-solid fa-rotate" :class="{'fa-spin': updatingPrices}"></i> 更新股价
                </button>
                <button @click="showNewStockModal = true" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22] text-xs">
              <div class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
                <div class="text-[10px] text-slate-400">总未实现盈亏</div>
                <div class="font-serif-num font-bold text-sm mt-0.5" :class="totalUnrealizedPL >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                  {{ totalUnrealizedPL >= 0 ? '+' : '' }}RM {{ formatNumber(totalUnrealizedPL) }}
                </div>
              </div>
              <div @click="openDividendSummaryModal" class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329] cursor-pointer active:scale-98 transition">
                <div class="text-[10px] text-amber-400 flex justify-between items-center"><span>💰 累计到账股息</span><span class="text-[9px]">点击看年度明细 ➔</span></div>
                <div class="font-serif-num font-bold text-amber-300 text-sm mt-0.5">
                  RM {{ formatNumber(totalDividendsSum) }}
                </div>
              </div>
            </div>
          </div>

          <div class="flex justify-between items-center px-1 text-xs">
            <div class="flex items-center gap-2">
              <span class="text-slate-400">排序:</span>
              <select v-model="stockSortMode" class="bg-[#132219] border border-[#2e4e3b] text-amber-300 rounded-lg px-2 py-1 text-xs outline-none">
                <option value="default">默认</option>
                <option value="valueDesc">市值由高到低</option>
                <option value="valueAsc">市值由低到高</option>
                <option value="plDesc">赚幅由高至低</option>
                <option value="plAsc">赚幅由低到高</option>
              </select>
            </div>
            <span class="text-[10px] text-slate-500">1 USD = {{ usdFxRate }} MYR</span>
          </div>

          <div class="space-y-2.5">
            <div v-if="sortedStockData.length === 0" class="text-xs text-slate-500 p-8 text-center border border-dashed border-[#1f3329] rounded-2xl">
              暂无股票卡片，点击右上角“+ 新增”创建
            </div>

            <div v-for="s in sortedStockData" :key="s.Ticker" class="forest-card rounded-2xl p-4 space-y-2 transition">
              <div @click="openStockDetail(s)" class="flex justify-between items-start cursor-pointer">
                <div>
                  <div class="font-extrabold text-base text-white flex items-center gap-2">
                    {{ s.Stock_Name }}
                  </div>
                  <div class="text-xs text-slate-400 font-mono mt-0.5">
                    {{ s.Ticker }} · <span class="text-amber-400">{{ s.Market || '大马股' }}</span>
                  </div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-slate-100 text-lg">
                    RM {{ formatNumber(getStockMarketValMYR(s)) }}
                  </div>
                  <div :class="getStockUnrealizedPL(s) >= 0 ? 'text-emerald-400' : 'text-rose-400'" class="text-[11px] font-bold">
                    {{ getStockUnrealizedPL(s) >= 0 ? '+' : '' }}RM {{ formatNumber(getStockUnrealizedPL(s)) }}
                    ({{ getStockUnrealizedPLPct(s) }}%)
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-[11px] text-slate-400">
                <div @click="openStockDetail(s)" class="cursor-pointer">{{ s.Total_Shares || 0 }} 股 · 现价 {{ s.Currency === 'USD' ? '$' : 'RM' }}{{ formatNumber(s.Current_Price) }}</div>
                <div class="flex gap-3">
                  <span @click="openStockDetail(s)" class="text-amber-400 cursor-pointer">详情/交易 ➔</span>
                  <span @click="deleteStockCard(s)" class="text-rose-400 cursor-pointer hover:underline">删除</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- SETTINGS -->
        <section v-if="activeTab === 'settings'" class="space-y-4">
          <div class="forest-card rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-sm text-white">⚙️ 汇率设置 (FX Rates)</h3>
            <div>
