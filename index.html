<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackEzy Asset Tracker</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    [v-cloak] { display: none !important; }
    body { background-color: #0b120e; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-serif-num { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; }
    .forest-card { background: linear-gradient(145deg, #132219 0%, #0d1711 100%); border: 1px solid rgba(46, 78, 59, 0.4); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
    .btn-gold-border { background: rgba(19, 34, 25, 0.8); border: 1px solid #9a7b38; color: #d4af37; }
    .input-dark { background-color: #090f0b; border: 1px solid #1f3329; color: white; border-radius: 0.75rem; padding: 0.5rem 0.75rem; font-size: 0.75rem; width: 100%; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen pb-28 antialiased">

  <div id="app" v-cloak class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-[#090f0b] border-x border-[#1a2e22]">

    <!-- PIN Lock Modal -->
    <div v-if="isLocked" class="fixed inset-0 z-50 bg-[#090f0b] flex flex-col items-center justify-center p-6 space-y-6">
      <div class="w-16 h-16 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400 text-2xl shadow-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-white tracking-wide">TrackEzy 安全保护</h2>
        <p class="text-xs text-slate-400">请输入解锁 PIN 码</p>
      </div>

      <div class="flex gap-3 my-4">
        <div v-for="i in 6" :key="i" class="w-4 h-4 rounded-full border border-[#2e4e3b]" :class="pinInput.length >= i ? 'bg-amber-400' : 'bg-[#132219]'"></div>
      </div>

      <div class="grid grid-cols-3 gap-4 w-full max-w-xs pt-4">
        <button v-for="n in [1,2,3,4,5,6,7,8,9]" :key="n" @click="pressPin(n)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">{{ n }}</button>
        <button @click="pinInput = ''" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-xs font-bold active:scale-95 flex items-center justify-center mx-auto">清空</button>
        <button @click="pressPin(0)" class="w-16 h-16 rounded-2xl bg-[#132219] border border-[#1f3329] text-white font-serif-num text-xl font-bold active:scale-95 flex items-center justify-center mx-auto">0</button>
        <button @click="pinInput = pinInput.slice(0, -1)" class="w-16 h-16 rounded-2xl bg-[#132219]/40 text-slate-400 text-sm active:scale-95 flex items-center justify-center mx-auto"><i class="fa-solid fa-delete-left"></i></button>
      </div>
    </div>

    <!-- MAIN UI -->
    <template v-else>

      <header class="px-5 pt-5 pb-3 flex justify-between items-center bg-[#090f0b]/90 backdrop-blur-md sticky top-0 z-40 border-b border-[#1a2e22]">
        <h1 class="text-xl font-black text-slate-100 tracking-tight">{{ currentTabTitle }}</h1>
        <div class="flex items-center gap-2">
          <button @click="fetchData" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-slate-300">
            <i class="fa-solid fa-rotate" :class="{'fa-spin': loading}"></i>
          </button>
          <button @click="lockApp" class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400"><i class="fa-solid fa-lock text-xs"></i></button>
        </div>
      </header>

      <main class="p-4 space-y-4 flex-1">

        <!-- OVERVIEW -->
        <section v-if="activeTab === 'overview'" class="space-y-4">
          <!-- 1. 最上面：净资产总额卡片（正常显示，不 float） -->
          <div class="forest-card rounded-3xl p-5 relative overflow-hidden space-y-3 bg-gradient-to-br from-[#132219] to-[#0d1711] shadow-2xl">
            <div class="text-xs text-slate-400 font-medium">净资产总额</div>
            <div class="text-2xl font-bold tracking-tight text-white flex items-baseline gap-1.5">
              <span class="text-lg font-bold text-slate-200">RM</span>
              <span class="font-serif-num text-2xl sm:text-3xl text-slate-100 truncate">{{ formatNumber(displayedNetWorth) }}</span>
            </div>

            <div v-if="monthlyDiff" class="text-xs flex items-center gap-2 bg-[#0d1711] p-2 rounded-xl border border-[#1f3329]">
              <span class="text-slate-400">相比上月:</span>
              <span class="font-serif-num font-bold" :class="monthlyDiff.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                {{ monthlyDiff.amount >= 0 ? '+' : '' }}RM {{ formatNumber(monthlyDiff.amount) }} ({{ monthlyDiff.pct >= 0 ? '+' : '' }}{{ monthlyDiff.pct }}%)
              </span>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button @click="useTP = false" :class="!useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-1.5 rounded-xl text-xs font-bold border">按市值</button>
              <button @click="useTP = true" :class="useTP ? 'bg-[#1d3326] text-amber-300 border-[#2e4e3b]' : 'bg-[#132219]/60 text-slate-400 border-[#1f3329]'" class="py-1.5 rounded-xl text-xs font-bold border">按目标价 TP</button>
            </div>

            <div class="grid grid-cols-2 gap-y-2 gap-x-3 pt-2 border-t border-[#1a2e22] text-xs">
              <div class="flex justify-between items-center"><span class="text-blue-400">● 现金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.cash) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-blue-300">● 银行存款</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.bank) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-amber-400">● 虚拟黄金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.paperGold) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-amber-300">● 实体黄金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.physicalGold) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-rose-400">● 股票</span><span class="font-serif-num font-bold">RM {{ formatNumber(useTP ? totals.stockTP : totals.stockMarket) }}</span></div>
              <div class="flex justify-between items-center"><span class="text-purple-400">● 公积金</span><span class="font-serif-num font-bold">RM {{ formatNumber(totals.epf) }}</span></div>
            </div>

            <button @click="openSnapshotModal" class="w-full btn-gold-border font-bold py-2.5 rounded-2xl text-xs flex items-center justify-center gap-2"><i class="fa-solid fa-camera"></i> 手动记录快照 </button>
          </div>

          <!-- 2. 往下接着是固定标题，以及只有列表部分才开始 float 吸顶 -->
          <div class="space-y-2 pt-2">
            <!-- 固定的标题行 -->
            <div class="sticky top-14 z-30 bg-[#090f0b]/95 backdrop-blur-md py-2 px-1 text-xs text-slate-400 font-bold border-b border-[#1a2e22]">
              📜 历史结账与快照列表 (点击查看分类详情)
            </div>
            
            <!-- 具体的历史记录列表（向下滚动时在标题下方滚动） -->
            <div class="space-y-2 pt-1">
              <div v-for="h in groupedHistoryList" :key="h.date + h.remarkBase" @click="openHistoryDetail(h)" class="forest-card rounded-2xl p-3.5 flex justify-between items-center cursor-pointer active:scale-98 transition text-xs">
                <div>
                  <div class="font-bold text-slate-200 font-mono">{{ cleanDate(h.date) }}</div>
                  <div class="text-[10px] text-amber-400/80 mt-0.5">{{ h.remarkBase }} ➔ 点击看分类详情</div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-slate-100 text-sm">RM {{ formatNumber(h.marketVal) }}</div>
                  <div class="font-serif-num text-[10px] text-amber-300 mt-0.5">TP目标价: RM {{ formatNumber(h.tpVal) }}</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- CASH -->
        <section v-if="activeTab === 'cash'" class="space-y-4">
          <div class="sticky top-14 z-30 forest-card p-4 rounded-2xl space-y-3 backdrop-blur-md bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-slate-400">现金与存款总计</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.cash + totals.bank) }}</div>
              </div>
              <button @click="openAddCashModal" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增账户</button>
            </div>
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openCashTxnModal('Deposit')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold">➕ 存款</button>
              <button @click="openCashTxnModal('Withdrawal')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold">➖ 提款</button>
              <button @click="openCashTxnModal('Transfer')" class="bg-blue-600/20 text-blue-300 border border-blue-500/30 py-2 rounded-xl text-xs font-bold">🔄 转账</button>
            </div>
          </div>

          <div class="space-y-2">
            <div class="text-xs font-bold text-slate-300 px-1">💵 现金 (Cash)</div>
            <div v-if="cashAccounts.filter(a => a.Type === 'Cash').length === 0" class="text-xs text-slate-500 px-1">暂无现金账户</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Cash')" :key="acc.Account_ID" class="forest-card rounded-2xl p-3.5 flex justify-between items-center">
              <div @click="openTxnHistoryModal(acc)" class="cursor-pointer flex-1">
                <div class="font-bold text-sm text-slate-100">{{ acc.Account_Nickname }}</div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看历史明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
                <button @click="deleteCashAccount(acc)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>

          <div class="space-y-2 pt-2">
            <div class="text-xs font-bold text-slate-300 px-1">🏦 银行存款户口</div>
            <div v-if="cashAccounts.filter(a => a.Type === 'Bank').length === 0" class="text-xs text-slate-500 px-1">暂无银行账户</div>
            <div v-for="acc in cashAccounts.filter(a => a.Type === 'Bank')" :key="acc.Account_ID" class="forest-card rounded-2xl p-3.5 flex justify-between items-center">
              <div @click="openTxnHistoryModal(acc)" class="cursor-pointer flex-1">
                <div class="font-bold text-sm text-slate-100">{{ acc.Bank_Name }} <span class="text-xs font-normal text-slate-400">({{ acc.Account_Nickname }})</span></div>
                <div class="text-[10px] text-amber-400/80 mt-0.5">点击查看历史明细 ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100">RM {{ formatNumber(acc.Current_Balance) }}</div>
                <button @click="deleteCashAccount(acc)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>
        </section>

        <!-- GOLD -->
        <section v-if="activeTab === 'gold'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3 bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-amber-400 font-medium">黄金总市值</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.gold) }}</div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openGoldTxnModal('buy')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold">➕ 买入黄金</button>
              <button @click="openGoldTxnModal('sell')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold">➖ 卖出黄金</button>
            </div>
          </div>

          <div class="space-y-3">
            <div v-for="g in goldList" :key="g.Type" class="forest-card rounded-2xl p-4 space-y-3">
              <div class="flex justify-between items-center">
                <div>
                  <div class="font-bold text-sm text-slate-100">{{ g.Type === 'Paper' ? '🪙 虚拟黄金 (Paper Gold)' : '🥇 实体黄金 (Gold Bar)' }}</div>
                  <div class="text-[10px] text-slate-400 mt-0.5 font-serif-num">{{ g.Grams || 0 }} 克 · 买入均价 RM {{ formatNumber(g.Avg_Price) }}/g</div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-amber-300 text-base">RM {{ formatNumber(getGoldMarketVal(g)) }}</div>
                  <div :class="getGoldPL(g) >= 0 ? 'text-emerald-400' : 'text-rose-400'" class="text-[11px] font-bold font-serif-num">
                    {{ getGoldPL(g) >= 0 ? '+' : '' }}RM {{ formatNumber(getGoldPL(g)) }} ({{ getGoldPLPct(g) }}%)
                  </div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-xs">
                <span class="text-slate-400 font-serif-num">当前市价: RM {{ formatNumber(g.Market_Price_Per_Gram || g.Avg_Price) }}/g</span>
                <button @click="promptUpdateGoldPrice(g)" class="btn-gold-border px-2.5 py-1 rounded-xl text-[11px] font-bold">修改当前市价 ✏️</button>
              </div>

              <div class="pt-2 border-t border-[#1a2e22] space-y-2">
                <div class="text-[11px] font-bold text-slate-300">📜 {{ g.Type === 'Paper' ? '虚拟黄金' : '实体黄金' }} 交易历史 (近两年)</div>
                <div v-if="getGoldTxnsByType(g.Type).length === 0" class="text-[10px] text-slate-500 py-2">暂无交易记录</div>
                <div v-for="t in getGoldTxnsByType(g.Type)" :key="t.Txn_ID" class="bg-[#0d1711] border border-[#1f3329] rounded-xl p-2.5 flex justify-between items-center text-xs">
                  <div>
                    <div class="font-bold text-slate-200">{{ t.Txn_Type === 'buy' ? '➕ 买入' : '➖ 卖出' }} · {{ cleanDate(t.Date) }}</div>
                    <div class="text-[10px] text-slate-400 font-serif-num">{{ t.Grams }} 克 @ RM {{ formatNumber(t.Price) }}/g</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <div class="text-right font-serif-num font-bold text-amber-300">RM {{ formatNumber(t.Grams * t.Price) }}</div>
                    <button @click="openEditGoldTxn(t)" class="text-amber-400 text-[10px] hover:underline">编辑</button>
                    <button @click="deleteGoldTxn(t)" class="text-rose-400 text-[10px] hover:underline">删除</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- EPF -->
        <section v-if="activeTab === 'epf'" class="space-y-4">
          <div class="forest-card p-4 rounded-2xl space-y-3 bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-purple-400">公积金总额</div>
                <div class="font-serif-num text-2xl font-bold text-slate-100 mt-1">RM {{ formatNumber(totals.epf) }}</div>
              </div>
              <button @click="openAddEPFAccModal" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增账户</button>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22]">
              <button @click="openEPFTxnModalAction('Deposit')" class="bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold">➕ 供款/利息</button>
              <button @click="openEPFTxnModalAction('Withdrawal')" class="bg-rose-600/20 text-rose-300 border border-rose-500/30 py-2 rounded-xl text-xs font-bold">➖ 提款</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div v-for="fund in epfData" :key="fund.Account_Key" class="forest-card rounded-2xl p-4 flex justify-between items-center">
              <div @click="openEPFHistoryModal(fund)" class="cursor-pointer flex-1">
                <span class="text-[9px] bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-bold">{{ fund.Category }}</span>
                <div class="font-bold text-slate-100 text-base mt-1.5">{{ fund.Fund_Name }}</div>
                <div class="text-[10px] text-purple-300/80 mt-0.5">点击查看明细 (近两年) ➔</div>
              </div>
              <div class="flex items-center gap-3">
                <div class="font-serif-num font-bold text-slate-100 text-base">RM {{ formatNumber(fund.Current_Balance) }}</div>
                <button @click="deleteEPFAccount(fund)" class="text-rose-400 text-xs hover:underline">删除</button>
              </div>
            </div>
          </div>
        </section>

        <!-- STOCKS -->
        <section v-if="activeTab === 'stocks'" class="space-y-3">
          <div class="sticky top-14 z-30 forest-card rounded-3xl p-4 space-y-3 backdrop-blur-md bg-gradient-to-br from-[#132219]/98 to-[#0d1711]/98 border border-[#2e4e3b] shadow-xl">
            <div class="flex justify-between items-center">
              <div>
                <div class="text-xs text-emerald-400 font-medium">📈 股票总市值</div>
                <div class="font-serif-num text-2xl font-bold text-white mt-0.5">RM {{ formatNumber(totals.stockMarket) }}</div>
              </div>
              <div class="flex gap-2">
                <button @click="syncUsdStockPrices" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5" :disabled="loading">
                  <i class="fa-solid fa-rotate" :class="{'fa-spin': updatingPrices}"></i> 更新股价
                </button>
                <button @click="openNewStockModal" class="btn-gold-border px-3 py-2 rounded-xl text-xs font-bold">+ 新增</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-[#1a2e22] text-xs">
              <div class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329]">
                <div class="text-[10px] text-slate-400">总未实现盈亏</div>
                <div class="font-serif-num font-bold text-sm mt-0.5" :class="totalUnrealizedPL >= 0 ? 'text-emerald-400' : 'text-rose-400'">
                  {{ totalUnrealizedPL >= 0 ? '+' : '' }}RM {{ formatNumber(totalUnrealizedPL) }}
                </div>
              </div>
              <div @click="openDividendSummaryModal" class="bg-[#0d1711] p-2.5 rounded-xl border border-[#1f3329] cursor-pointer active:scale-98 transition">
                <div class="text-[10px] text-amber-400 flex justify-between items-center"><span>💰 今年累计股息</span><span class="text-[9px]">点击看年度对比 ➔</span></div>
                <div class="font-serif-num font-bold text-amber-300 text-sm mt-0.5">
                  RM {{ formatNumber(currentYearDividendsSum) }}
                </div>
              </div>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-[#1a2e22] text-xs">
              <div class="flex items-center gap-2">
                <span class="text-slate-400">排序:</span>
                <select v-model="stockSortMode" class="bg-[#132219] border border-[#2e4e3b] text-amber-300 rounded-lg px-2 py-1 text-xs outline-none">
                  <option value="default">默认</option>
                  <option value="valueDesc">市值由高到低</option>
                  <option value="valueAsc">市值由低到高</option>
                  <option value="plDesc">赚幅由高至低</option>
                  <option value="plAsc">赚幅由低到高</option>
                </select>
              </div>
              <span class="text-[10px] text-slate-500 font-serif-num">1 USD = {{ usdFxRate }} MYR</span>
            </div>
          </div>

          <div class="space-y-2.5 pt-1">
            <div v-if="sortedStockData.length === 0" class="text-xs text-slate-500 p-8 text-center border border-dashed border-[#1f3329] rounded-2xl">
              暂无股票卡片，点击右上角“+ 新增”创建
            </div>

            <div v-for="s in sortedStockData" :key="s.Ticker" class="forest-card rounded-2xl p-4 space-y-2 transition">
              <div @click="openStockDetail(s)" class="flex justify-between items-start cursor-pointer">
                <div>
                  <div class="font-extrabold text-base text-white flex items-center gap-2">
                    {{ s.Stock_Name }}
                  </div>
                  <div class="text-xs text-slate-400 mt-0.5 font-serif-num">
                    {{ formatTickerDisplay(s.Ticker) }} · <span class="text-amber-400">{{ s.Market || '大马股' }}</span>
                  </div>
                </div>
                <div class="text-right">
                  <div class="font-serif-num font-bold text-slate-100 text-lg">
                    RM {{ formatNumber(getStockMarketValMYR(s)) }}
                  </div>

        const stockData = ref([]);
        const stockTxns = ref([]);
        const stockDividends = ref([]);
        const epfData = ref([]);
        const epfTxns = ref([]);
        const historyList = ref([]);

        const formatTickerDisplay = (tk) => {
          if (!tk) return '';
          let s = String(tk).trim();
          if (/^\d+$/.test(s) && s.length < 4) {
            return s.padStart(4, '0');
          }
          return s;
        };

        const currentYear = new Date().getFullYear();
        const minAllowedYear = currentYear - 1;

        const parseTimestamp = (dateVal) => {
          if (!dateVal) return 0;
          let s = String(dateVal).trim();
          if (s.includes('T')) s = s.split('T')[0];
          if (s.includes(' ')) s = s.split(' ')[0];

          if (s.includes('/')) {
            const parts = s.split('/');
            if (parts.length === 3 && parts[2].length === 4) {
              return new Date(`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`).getTime() || 0;
            }
          }
          if (s.includes('-')) {
            const parts = s.split('-');
            if (parts.length === 3) {
              if (parts[0].length === 4) {
                return new Date(s).getTime() || 0;
              } else if (parts[2].length === 4) {
                return new Date(`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`).getTime() || 0;
              }
            }
          }
          return new Date(s).getTime() || 0;
        };

        const parseYearNum = (dateVal) => {
          const ts = parseTimestamp(dateVal);
          if (!ts) return 0;
          return new Date(ts).getFullYear();
        };

        const sortByDateDesc = (list, dateField = 'Date') => {
          return [...list].sort((a, b) => {
            const tsa = parseTimestamp(a[dateField] || a.Record_Date || a.Pay_Date);
            const tsb = parseTimestamp(b[dateField] || b.Record_Date || b.Pay_Date);
            return tsb - tsa;
          });
        };

        const filterRecentTwoYears = (list, dateField = 'Date') => {
          return list.filter(item => {
            const yr = parseYearNum(item[dateField] || item.Record_Date || item.Pay_Date);
            if (!yr) return true;
            return yr >= minAllowedYear;
          });
        };

        // 💡 智能合并历史结账记录：把同一天（或同一批次）的 [按市值] 和 [按TP] 组合成一行优雅展示
        const groupedHistoryList = computed(() => {
          const map = {};
          historyList.value.forEach(h => {
            const dateStr = cleanDate(h.Record_Date);
            const rawRem = String(h.Remarks || '').trim();
            const isTP = rawRem.includes('[按TP]');
            const isMarket = rawRem.includes('[按市值]');
            
            // 清理备注基础名
            let remarkBase = rawRem.replace(/\[按市值\]|\[按TP\]/g, '').trim();
            if (!remarkBase || /^\d+$/.test(remarkBase)) remarkBase = '月度结账';

            // 以日期 + 基础备注作为组合 Key
            const groupKey = `${dateStr}_${remarkBase}`;
            if (!map[groupKey]) {
              map[groupKey] = {
                date: dateStr,
                remarkBase: remarkBase,
                marketVal: 0,
                tpVal: 0,
                marketItem: null,
                tpItem: null,
                latestTimestamp: parseTimestamp(h.Record_Date)
              };
            }

            const val = parseFloat(h.Total_Net_Worth) || 0;
            if (isTP) {
              map[groupKey].tpVal = val;
              map[groupKey].tpItem = h;
            } else if (isMarket || (!isTP && !isMarket)) {
              // 默认旧数据或按市值归为市值
              map[groupKey].marketVal = val;
              map[groupKey].marketItem = h;
            }
          });

          // 如果只有其中一个，互相补齐避免显示 0
          Object.values(map).forEach(g => {
            if (g.marketVal === 0 && g.tpVal > 0) g.marketVal = g.tpVal;
            if (g.tpVal === 0 && g.marketVal > 0) g.tpVal = g.marketVal;
            if (!g.marketItem && g.tpItem) g.marketItem = g.tpItem;
            if (!g.tpItem && g.marketItem) g.tpItem = g.marketItem;
          });

          return Object.values(map).sort((a, b) => b.latestTimestamp - a.latestTimestamp);
        });

        const recomputeLocalPortfolio = () => {
          stockData.value.forEach(s => {
            let totalShares = 0, totalCost = 0;
            stockTxns.value.filter(t => String(t.Ticker).trim().toUpperCase() === String(s.Ticker).trim().toUpperCase()).forEach(t => {
              const tType = String(t.Txn_Type).trim().toLowerCase();
              const sh = parseFloat(t.Shares) || 0;
              const pr = parseFloat(t.Price) || 0;
              if (tType === 'buy') {
                totalShares += sh;
                totalCost += (sh * pr);
              } else if (tType === 'sell') {
                totalShares -= sh;
                totalCost -= (sh * pr);
              }
            });
            s.Total_Shares = totalShares;
            s.Avg_Cost_Per_Share = totalShares > 0 ? (totalCost / totalShares) : 0;
          });
        };

        const submitEditEPFTxn = async () => {

        const showAddCashModal = ref(false);

          if (goldForm.value.txnType === 'sell') {

        const deleteGoldTxn = async (t) => {

            await postAction('deleteGoldTxn', { txnId: t.Txn_ID });

        const promptUpdateGoldPrice = async (g) => {
          const newPrice = prompt(`更新 [${g.Type === 'Paper' ? '虚拟黄金' : '实体黄金'}] 当前每克市价 (RM/克):`, g.Market_Price_Per_Gram || g.Avg_Price || 300);
          if (newPrice === null) return;
          await postAction('updateGoldMarketPrice', { goldType: g.Type, marketPrice: newPrice });
        };

        const getGoldMarketVal = (g) => {
          const grams = parseFloat(g.Grams) || 0;
          const marketPrice = parseFloat(g.Market_Price_Per_Gram) > 0 ? parseFloat(g.Market_Price_Per_Gram) : (parseFloat(g.Avg_Price) || 0);
          return grams * marketPrice;
        };

        const getGoldPL = (g) => {
          const grams = parseFloat(g.Grams) || 0;
          const costVal = grams * (parseFloat(g.Avg_Price) || 0);
          const marketVal = getGoldMarketVal(g);
          return marketVal - costVal;
        };

        const getGoldPLPct = (g) => {
          const grams = parseFloat(g.Grams) || 0;
          const costVal = grams * (parseFloat(g.Avg_Price) || 0);
          if (costVal <= 0) return '0.0';
          const pl = getGoldPL(g);
          return ((pl / costVal) * 100).toFixed(1);
        };

        const getGoldTxnsByType = (type) => {
          const list = goldTxns.value.filter(t => String(t.Gold_Type).trim() === String(type).trim());
          return sortByDateDesc(filterRecentTwoYears(list, 'Date'), 'Date');
        };

        const showAddEPFAccModal = ref(false);
        const epfAccForm = ref({ category: 'EPF', fundName: '', balance: '' });
        const openAddEPFAccModal = () => {
          epfAccForm.value = { category: 'EPF', fundName: '', balance: '' };
          showAddEPFAccModal.value = true;
        };
        
        const showAddEPFModal = ref(false);
        const epfForm = ref({ accountKey: '', type: 'Deposit', amount: '', remark: '', date: new Date().toISOString().split('T')[0] });
        
        const openEPFTxnModalAction = (type) => {
          if (epfData.value.length === 0) { alert('请先创建公积金账户！'); return; }
          epfForm.value = {
            accountKey: epfData.value[0].Account_Key,

            amount: '',
            remark: '',
            date: new Date().toISOString().split('T')[0]
          };

        const showEPFTxnModal = ref(false);
        const selectedEPFAccount = ref(null);
        const epfAccountTxns = computed(() => {
          if (!selectedEPFAccount.value) return [];

          return sortByDateDesc(filterRecentTwoYears(list, 'Date'), 'Date');

        const openEPFHistoryModal = (fund) => { selectedEPFAccount.value = fund; showEPFTxnModal.value = true; };

        const showNewStockModal = ref(false);
        const newStockForm = ref({ stockName: '', ticker: '', market: '大马股' });
        const openNewStockModal = () => {
          newStockForm.value = { stockName: '', ticker: '', market: '大马股' };
          showNewStockModal.value = true;
        };

        const showStockDetailModal = ref(false);
        const selectedStock = ref(null);

        const showAddStockTxnModal = ref(false);
        const stockTxnForm = ref({ txnType: 'Buy', ticker: '', broker: 'moomoo', date: '', shares: '', price: '', fees: '', linkedAccountId: '' });

        const showAddDivModal = ref(false);
        const divForm = ref({ ticker: '', payDate: '', units: '', perShareAmount: '', linkedAccountId: '' });

        const showDividendSummaryModal = ref(false);
        const openDividendSummaryModal = () => { showDividendSummaryModal.value = true; };

        const dividendComparisonTable = computed(() => {
          const map = {}; 
          const todayStr = new Date().toISOString().split('T')[0];

          stockDividends.value.forEach(d => {
            const payDate = cleanDate(d.Pay_Date);
            if (payDate && payDate <= todayStr) {
              const yr = String(parseYearNum(payDate));
              if (yr === '2025' || yr === '2026') {
                const rawTk = String(d.Ticker).trim().toUpperCase();
                const tk = formatTickerDisplay(rawTk);
                if (!map[tk]) {
                  const foundStk = stockData.value.find(s => formatTickerDisplay(s.Ticker) === tk);
                  map[tk] = {
                    ticker: tk,
                    stockName: foundStk ? foundStk.Stock_Name : tk,
                    val2025: 0,
                    val2026: 0
                  };
                }
                const amt = parseFloat(d.Total_Dividend_MYR) || 0;
                if (yr === '2025') map[tk].val2025 += amt;
                if (yr === '2026') map[tk].val2026 += amt;
              }
            }
          });

          return Object.values(map).map(item => {
            let pct = 0;
            if (item.val2025 > 0) {
              pct = (((item.val2026 - item.val2025) / item.val2025) * 100).toFixed(1);
            } else if (item.val2026 > 0) {
              pct = 100.0;
            }
            return {
              ...item,
              pct: parseFloat(pct)
            };
          }).sort((a, b) => (b.val2026 + b.val2025) - (a.val2026 + a.val2025));
        });

        const dividendTableTotals = computed(() => {
          let val2026 = 0;
          let val2025 = 0;
          dividendComparisonTable.value.forEach(item => {
            val2026 += item.val2026;
            val2025 += item.val2025;
          });
          let pct = 0;
          if (val2025 > 0) {
            pct = (((val2026 - val2025) / val2025) * 100).toFixed(1);
          } else if (val2026 > 0) {
            pct = 100.0;
          }
          return { val2026, val2025, pct: parseFloat(pct) };

        const showSnapshotModal = ref(false);

        const showHistoryDetailModal = ref(false);

        const getHistoryVal = (h, type) => {

          if (type === 'Bank') return parseFloat(h.Bank_Val || h.bank_val || h.Bank || 0) || 0;
          if (type === 'PaperGold') return parseFloat(h.Paper_Gold_Val || h.paper_gold_val || h.PaperGold || 0) || 0;

        const pressPin = (num) => {

            const json = await res.json();
            if (json.status === 'success') {
              cashAccounts.value = json.data.cashAccounts || [];
              cashTxns.value = json.data.cashTxns || [];
              goldList.value = json.data.goldList || [];
              goldTxns.value = json.data.goldTxns || [];
              stockData.value = json.data.stockData || [];
              stockTxns.value = json.data.stockTxns || [];
              stockDividends.value = json.data.stockDividends || [];
              epfData.value = json.data.epfData || [];
              epfTxns.value = json.data.epfTxns || [];
              historyList.value = json.data.history || [];
              
              if (json.data.settings) {
                if (json.data.settings.PIN) correctPin.value = String(json.data.settings.PIN);
                if (json.data.settings.FX_USD) usdFxRate.value = parseFloat(json.data.settings.FX_USD) || 4.40;
              }
              recomputeLocalPortfolio();
            }
          } catch (e) { console.error(e); } finally { loading.value = false; }
        };

        const postAction = async (action, body, silent = false) => {
          if (loading.value) return;
          loading.value = true;
          try {
            const payload = JSON.stringify({ action, ...body });
            const res = await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload });
            const json = await res.json();
            if (json.status === 'success' && json.data) {
              cashAccounts.value = json.data.cashAccounts || [];
              cashTxns.value = json.data.cashTxns || [];
              goldList.value = json.data.goldList || [];
              goldTxns.value = json.data.goldTxns || [];
              stockData.value = json.data.stockData || [];
              stockTxns.value = json.data.stockTxns || [];
              stockDividends.value = json.data.stockDividends || [];
              epfData.value = json.data.epfData || [];
              epfTxns.value = json.data.epfTxns || [];
              historyList.value = json.data.history || [];
              
              if (json.data.settings) {
                if (json.data.settings.PIN) correctPin.value = String(json.data.settings.PIN);
                if (json.data.settings.FX_USD) usdFxRate.value = parseFloat(json.data.settings.FX_USD) || 4.40;
              }
              recomputeLocalPortfolio();
              if (!silent) alert('操作成功！');
            } else {
              if (json.message && !silent) alert(json.message);
              await fetchData();
            }
          } catch (e) { 
            if (!silent) alert('网络开小差了，请重试');
            else await fetchData();
          } finally { loading.value = false; }
        };

        const saveNewPin = async () => {
          if (loading.value) return;
          if (!newPinInput.value || newPinInput.value.length < 4) return alert('请输入至少 4 位新 PIN 码！');
          await postAction('updatePin', { newPin: newPinInput.value });
          newPinInput.value = '';
        };

        const saveFxRate = async () => {
          if (loading.value) return;
          await postAction('updateFx', { fxUsd: usdFxRate.value });
        };

        const syncUsdStockPrices = async () => {
          if (loading.value) return;
          updatingPrices.value = true;
          try {
            await postAction('manualSyncMalaysianStocks', {}, true);
            await fetchData();
          } catch (e) {
            // 静默
          } finally { 
            updatingPrices.value = false; 
          }
        };

        const submitNewStock = async () => {
          if (loading.value) return;
          if (!newStockForm.value.stockName || !newStockForm.value.ticker) return alert('请填全名字和代码！');
          showNewStockModal.value = false;
          await postAction('addNewStock', newStockForm.value);
        };

        const deleteStockCard = async (s) => {
          if (loading.value) return;
          if (confirm(`确认删除股票 ${s.Stock_Name} (${s.Ticker}) 吗？`)) {
            await postAction('deleteStock', { ticker: s.Ticker });
          }
        };

        const openStockDetail = (s) => { 
          selectedStock.value = s; 
          showStockDetailModal.value = true; 
        };

        const openAddTxnForStock = (type) => {
          const today = new Date().toISOString().split('T')[0];
          stockTxnForm.value = { txnType: type, ticker: selectedStock.value.Ticker, broker: 'moomoo', date: today, shares: '', price: '', fees: '', linkedAccountId: '' };
          showAddStockTxnModal.value = true;
        };

        const submitAddStockTxn = async () => {
          if (loading.value) return;
          if (!stockTxnForm.value.shares || !stockTxnForm.value.price) return alert('请填全股数与单价！');
          if (stockTxnForm.value.txnType === 'Sell') {
            const currentShares = parseFloat(selectedStock.value.Total_Shares) || 0;
            const sellShares = parseFloat(stockTxnForm.value.shares) || 0;
            if (sellShares > currentShares) return alert(`当前持有 ${currentShares} 股，无法卖出 ${sellShares} 股！`);
          }
          showAddStockTxnModal.value = false;
          await postAction('addStockTxn', stockTxnForm.value);
          recomputeLocalPortfolio();
          if (selectedStock.value) {
            const updated = stockData.value.find(s => formatTickerDisplay(s.Ticker) === formatTickerDisplay(selectedStock.value.Ticker));
            if (updated) selectedStock.value = updated;
          }
        };

        const promptUpdateTP = async (s) => {
          const newTP = prompt(`更新 ${s.Ticker} 的目标价 TP (${s.Currency}):`, s.Target_Price_TP || s.Current_Price);
          if (newTP === null) return;
          const tp = parseFloat(newTP) || 0;
          s.Target_Price_TP = tp;
          if (selectedStock.value && String(selectedStock.value.Ticker) === String(s.Ticker)) {
            selectedStock.value.Target_Price_TP = tp;
          }
          await postAction('updateStockTP', { ticker: s.Ticker, targetPrice: tp });
        };

        const deleteStockTxn = async (t) => {
          if (loading.value) return;
          if (confirm('确定删除此笔交易明细？')) {
            await postAction('deleteStockTxn', { txnId: t.Txn_ID });
            recomputeLocalPortfolio();
          }
        };

        const openAddDivForStock = () => {
          const today = new Date().toISOString().split('T')[0];
          divForm.value = { ticker: selectedStock.value.Ticker, payDate: today, units: selectedStock.value.Total_Shares || '', perShareAmount: '', linkedAccountId: '' };
          showAddDivModal.value = true;
        };

        const submitAddDiv = async () => {
          if (loading.value) return;
          if (!divForm.value.perShareAmount || !divForm.value.units) return alert('请填全持股数与每股派息额！');
          showAddDivModal.value = false;
          await postAction('addStockDividend', divForm.value);
        };

        const deleteStockDividend = async (d) => {
          if (loading.value) return;
          if (confirm('确认删除此笔股息？')) await postAction('deleteStockDividend', { divId: d.Div_ID });
        };

        const submitAddCash = async () => {
          if (loading.value) return;
          if (cashForm.value.type === 'Bank' && !cashForm.value.bankName) return alert('请输入机构名字！');
          if (cashForm.value.type === 'Cash') {
            cashForm.value.bankName = '';
          }
          showAddCashModal.value = false;
          await postAction('addCashAccount', cashForm.value);
        };

        const deleteCashAccount = async (acc) => {
          if (loading.value) return;
          if (confirm(`确认删除存款账户 [${acc.Bank_Name ? acc.Bank_Name + ' - ' : ''}${acc.Account_Nickname}] 吗？`)) await postAction('deleteCashAccount', { accountId: acc.Account_ID });
        };

        const submitCashTxn = async () => {
          if (loading.value) return;
          const amt = parseFloat(cashTxnForm.value.amount);
          if (!amt || amt <= 0) return alert('请输入有效的变动金额（必须为正数）！');

          if (cashTxnForm.value.type === 'Withdrawal') {
            const targetAcc = cashAccounts.value.find(a => String(a.Account_ID) === String(cashTxnForm.value.accountId));
            const curBal = targetAcc ? (parseFloat(targetAcc.Current_Balance) || 0) : 0;
            if (amt > curBal) return alert(`提取金额 (RM ${amt}) 不能大于当前可用余额 (RM ${curBal})！`);
          } else if (cashTxnForm.value.type === 'Transfer') {
            if (cashTxnForm.value.fromAccountId === cashTxnForm.value.toAccountId) return alert('转出账户和转入账户不能是同一个！');
            const fromAcc = cashAccounts.value.find(a => String(a.Account_ID) === String(cashTxnForm.value.fromAccountId));
            const curBal = fromAcc ? (parseFloat(fromAcc.Current_Balance) || 0) : 0;
            if (amt > curBal) return alert(`转出账户余额不足 (当前: RM ${curBal})！`);
          }

          showCashTxnModal.value = false;
          await postAction('updateCashBalance', cashTxnForm.value);
        };

        const deleteCashTxn = async (t) => {
          if (loading.value) return;
          if (confirm('确认删除此笔资金流水？')) await postAction('deleteCashTxn', { txnId: t.Txn_ID, accountId: t.Account_ID });
        };

        const submitAddEPFAccount = async () => {
          if (loading.value) return;
          if (!epfAccForm.value.fundName) return alert('请输入公积金账户名称！');
          showAddEPFAccModal.value = false;
          await postAction('addEPFAccount', epfAccForm.value);
        };

        const deleteEPFAccount = async (fund) => {
          if (loading.value) return;
          if (confirm(`确认删除公积金账户 [${fund.Fund_Name}] 吗？`)) await postAction('deleteEPFAccount', { accountKey: fund.Account_Key });
        };

        const submitAddEPFTransaction = async () => {
          if (loading.value) return;
          const amt = parseFloat(epfForm.value.amount);
          if (!amt || amt <= 0) return alert('请输入有效的金额（必须为正数）！');

          if (epfForm.value.type === 'Withdrawal') {
            const targetEpf = epfData.value.find(e => String(e.Account_Key) === String(epfForm.value.accountKey));
            const curBal = targetEpf ? (parseFloat(targetEpf.Current_Balance) || 0) : 0;
            if (amt > curBal) return alert(`提款金额 (RM ${amt}) 不能大于当前公积金余额 (RM ${curBal})！`);
          }

          showAddEPFModal.value = false;
          await postAction('addEPFTransaction', epfForm.value);
        };

        const deleteEPFTxn = async (t) => {
          if (loading.value) return;
          if (confirm('确认删除此笔公积金明细？')) await postAction('deleteEPFTxn', { txnId: t.Txn_ID, accountKey: t.Account_Key });
        };

        const openSnapshotModal = () => {
          const now = new Date();
          snapshotForm.value = { date: new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0], remarks: '月度结账' };
          showSnapshotModal.value = true;
        };

        const submitDualSnapshots = async () => {
          if (loading.value) return;
          if (!snapshotForm.value.remarks) return alert('请填写备注基础名！');
          showSnapshotModal.value = false;

          const baseRemark = snapshotForm.value.remarks;
          const dateVal = snapshotForm.value.date;

          loading.value = true;
          try {
            await fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'logSnapshot',
                totalNetWorth: displayedNetWorthMarket.value,
                cashVal: totals.value.cash,
                bankVal: totals.value.bank,
                paperGoldVal: totals.value.paperGold,
                physicalGoldVal: totals.value.physicalGold,
                stockVal: totals.value.stockMarket,
                epfVal: totals.value.epf,
                recordDate: dateVal,
                remarks: `${baseRemark} [按市值]`
              })
            });

            const res2 = await fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'logSnapshot',
                totalNetWorth: displayedNetWorthTP.value,
                cashVal: totals.value.cash,
                bankVal: totals.value.bank,
                paperGoldVal: totals.value.paperGold,
                physicalGoldVal: totals.value.physicalGold,
                stockVal: totals.value.stockTP,
                epfVal: totals.value.epf,
                recordDate: dateVal,
                remarks: `${baseRemark} [按TP]`
              })
            });
            const json2 = await res2.json();
            if (json2.status === 'success' && json2.data) {
              cashAccounts.value = json2.data.cashAccounts || [];
              cashTxns.value = json2.data.cashTxns || [];
              goldList.value = json2.data.goldList || [];
              goldTxns.value = json2.data.goldTxns || [];
              stockData.value = json2.data.stockData || [];
              stockTxns.value = json2.data.stockTxns || [];
              stockDividends.value = json2.data.stockDividends || [];
              epfData.value = json2.data.epfData || [];
              epfTxns.value = json2.data.epfTxns || [];
              historyList.value = json2.data.history || [];
              recomputeLocalPortfolio();
              alert('双重快照（按市值 & 按TP）已成功记录！');
            } else {
              await fetchData();
            }
          } catch (e) {
            alert('网络开小差了，请重试');
          } finally {
            loading.value = false;
          }
        };

        const formatNumber = (val) => {
          const num = parseFloat(String(val).replace(/,/g, ''));
          return isNaN(num) ? '0.00' : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const formatPerShare = (val) => {
          const num = parseFloat(String(val).replace(/,/g, ''));
          return isNaN(num) ? '0.0000' : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
        };

        return {
          isLocked, pinInput, correctPin, newPinInput, pressPin, saveNewPin, saveFxRate, loading, updatingPrices, activeTab, tabs, useTP, usdFxRate, stockSortMode, currentTabTitle,
          cashAccounts, cashTxns, goldList, goldTxns, stockData, sortedStockData, stockTxns, stockDividends, epfData, epfTxns, historyList, groupedHistoryList, totals, displayedNetWorth,
          monthlyDiff, totalUnrealizedPL, currentYearDividendsSum, syncUsdStockPrices, cleanDate, getHistoryVal,
          showHistoryDetailModal, selectedHistoryGroup, openHistoryDetail,
          showDividendSummaryModal, openDividendSummaryModal, dividendComparisonTable, dividendTableTotals, formatTickerDisplay,
          showAddCashModal, cashForm, openAddCashModal, onCashTypeChange, deleteCashAccount, showCashTxnModal, cashTxnForm, openCashTxnModal, showTxnHistoryModal, selectedAccount, accountTxns, openTxnHistoryModal, deleteCashTxn,
          showAddGoldModal, goldForm, openGoldTxnModal, submitAddGold, deleteGoldTxn, promptUpdateGoldPrice, getGoldMarketVal, getGoldPL, getGoldPLPct, getGoldTxnsByType,
          showAddEPFAccModal, epfAccForm, openAddEPFAccModal, deleteEPFAccount, showAddEPFModal, epfForm, openEPFTxnModalAction, showEPFTxnModal, selectedEPFAccount, epfAccountTxns, openEPFHistoryModal, submitAddEPFAccount, submitAddEPFTransaction, deleteEPFTxn,
          showNewStockModal, newStockForm, openNewStockModal, submitNewStock, deleteStockCard,
          showStockDetailModal, selectedStock, selectedStockTxns, selectedStockDivs, openStockDetail, promptUpdateTP,
          showAddStockTxnModal, stockTxnForm, openAddTxnForStock, submitAddStockTxn, deleteStockTxn,
          showAddDivModal, divForm, openAddDivForStock, submitAddDiv, deleteStockDividend,
          getStockMarketValMYR, getStockUnrealizedPL, getStockUnrealizedPLPct,
          showSnapshotModal, snapshotForm, fetchData, submitAddCash, submitCashTxn, openSnapshotModal, submitDualSnapshots, formatNumber, formatPerShare,
          showEditCashTxnModal, editCashTxnForm, openEditCashTxn, submitEditCashTxn,
          showEditGoldTxnModal, editGoldTxnForm, openEditGoldTxn, submitEditGoldTxn,
          showEditStockTxnModal, editStockTxnForm, openEditStockTxn, submitEditStockTxn,
          showEditDivModal, editDivForm, openEditStockDividend, submitEditDiv,
          showEditEPFTxnModal, editEPFTxnForm, openEditEPFTxn, submitEditEPFTxn,
          displayedNetWorthMarket, displayedNetWorthTP,
          lockApp
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
