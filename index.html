<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackEzy Premium Asset Tracker</title>
  
  <!-- 引入 Tailwind CSS & FontAwesome 图标库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 引入高级衬线字体 (Playfair Display) 还原图片中的数字风格 -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 全局深墨绿高级暗黑主题色调 */
    body {
      background-color: #0b120e;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 优雅高贵数字衬线体 */
    .font-serif-num {
      font-family: 'Playfair Display', serif;
    }

    /* 深度墨绿微光卡片 */
    .forest-card {
      background: linear-gradient(145deg, #132219 0%, #0d1711 100%);
      border: 1px solid rgba(46, 78, 59, 0.4);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* 金色与墨绿高亮按钮 */
    .btn-gold-border {
      background: rgba(19, 34, 25, 0.8);
      border: 1px solid #9a7b38;
      color: #d4af37;
    }

    /* 点阵微弱背景纹理 */
    .bg-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="bg-dots min-h-screen pb-28 antialiased selection:bg-amber-500 selection:text-slate-900">

  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between relative shadow-2xl bg-[#090f0b] border-x border-[#1a2e22]">

    <!-- 顶部页头 HEADER -->
    <header class="px-5 pt-6 pb-3 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black text-slate-100 tracking-tight">总览</h1>
      </div>
      <div class="w-8 h-8 rounded-full bg-[#132219] border border-[#2e4e3b] flex items-center justify-center text-amber-400">
        <i class="fa-solid fa-lock text-xs"></i>
      </div>
    </header>

    <!-- 主体内容区域 MAIN -->
    <main class="p-4 space-y-4 flex-1">

      <!-- 1. 净资产看板卡片 (完美还原 IMG_3691.jpg) -->
      <section class="forest-card rounded-3xl p-5 relative overflow-hidden space-y-4">
        <div class="text-xs text-slate-400 font-medium">净资产总额</div>
        
        <div class="text-3xl font-bold tracking-tight text-white flex items-baseline gap-1.5">
          <span class="text-xl font-bold text-slate-200">RM</span>
          <span class="font-serif-num text-4xl text-slate-100">928,789.00</span>
        </div>

        <div class="text-xs text-emerald-400 font-medium flex items-center gap-1">
          <i class="fa-solid fa-caret-up"></i>
          <span>RM 3,688.00 (+0.4%)</span>
          <span class="text-slate-500 ml-1">较上次记录</span>
        </div>

        <!-- 按市值 / 按目标价 TP 切换 -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button class="py-2 rounded-xl text-xs font-bold bg-[#1d3326] text-amber-300 border border-[#2e4e3b] shadow-inner">
            按市值
          </button>
          <button class="py-2 rounded-xl text-xs font-medium bg-[#132219]/60 text-slate-400 border border-[#1f3329] hover:text-slate-200">
            按目标价 TP
          </button>
        </div>

        <!-- 资产占比六大项分类统计网格 -->
        <div class="grid grid-cols-3 gap-y-3 gap-x-2 pt-3 border-t border-[#1a2e22] text-xs">
          <div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-blue-400"></span> 现金
            </div>
            <div class="font-serif-num font-bold text-slate-200 mt-0.5">RM 8,200</div>
            <div class="text-[10px] text-slate-500">1%</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-cyan-400"></span> 存款
            </div>
            <div class="font-serif-num font-bold text-slate-200 mt-0.5">RM 37,118</div>
            <div class="text-[10px] text-slate-500">4%</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span> 纸黄金
            </div>
            <div class="font-serif-num font-bold text-slate-200 mt-0.5">RM 1,224</div>
            <div class="text-[10px] text-slate-500">0%</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-yellow-500"></span> 金条
            </div>
            <div class="font-serif-num font-bold text-slate-200 mt-0.5">RM 11,534</div>
            <div class="text-[10px] text-slate-500">1%</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-rose-400"></span> 股票
            </div>
            <div class="font-serif-num font-bold text-slate-200 mt-0.5">RM 245,052</div>
            <div class="text-[10px] text-slate-500">26%</div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-purple-400"></span> EPF
            </div>
            <div class="font-serif-num font-bold text-slate-200 mt-0.5">RM 625,661</div>
            <div class="text-[10px] text-slate-500">67%</div>
          </div>
        </div>

        <!-- 记录本月净值按钮 -->
        <button class="w-full btn-gold-border font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg active:scale-98 transition">
          <i class="fa-solid fa-camera"></i> 记录本月净值 (Snapshot)
        </button>
      </section>

      <!-- 2. 股票简明看板预览 (参照 IMG_3695.jpg) -->
      <section class="forest-card rounded-3xl p-4 space-y-3">
        <div class="flex justify-between items-center text-xs">
          <span class="font-bold text-slate-200 flex items-center gap-1.5">
            <i class="fa-solid fa-chart-line text-emerald-400"></i> 持仓股票
          </span>
          <span class="font-serif-num text-slate-300 font-bold">RM 245,052.00</span>
        </div>

        <!-- 单只股票卡片演示 (YTL) -->
        <div class="bg-[#0e1812] rounded-2xl p-3 border border-[#1f3329] space-y-1.5">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold text-slate-100 text-sm">YTL</div>
              <div class="text-[10px] text-amber-500 font-mono">4677.KL · 大马股 · RHB TradeSmart</div>
            </div>
            <div class="text-right">
              <div class="font-serif-num font-bold text-slate-100 text-sm">RM 62,400.00</div>
              <div class="text-[10px] text-emerald-400 font-medium">+RM 6,020.00 (+10.7%)</div>
            </div>
          </div>
          <div class="text-[10px] text-slate-400 pt-1 flex justify-between border-t border-[#18291f]">
            <span>26,000 股 · 现价 RM 2.40</span>
            <span class="text-rose-400 font-bold"><i class="fa-solid fa-trash-can mr-1"></i>删除</span>
          </div>
        </div>
      </section>

    </main>

    <!-- 底部 TAB 6 大导航栏 (完美匹配原画导航图标) -->
    <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#080d09]/95 backdrop-blur-md border-t border-[#1a2e22] px-2 py-3 grid grid-cols-6 gap-1 text-[10px] text-center font-medium">
      <button class="text-amber-400 flex flex-col items-center gap-1">
        <i class="fa-solid fa-house text-base"></i>
        <span>总览</span>
      </button>
      <button class="text-slate-500 hover:text-slate-300 flex flex-col items-center gap-1">
        <i class="fa-solid fa-[#132219] fa-wallet text-base"></i>
        <span>现金</span>
      </button>
      <button class="text-slate-500 hover:text-slate-300 flex flex-col items-center gap-1">
        <i class="fa-solid fa-coins text-base"></i>
        <span>黄金</span>
      </button>
      <button class="text-slate-500 hover:text-slate-300 flex flex-col items-center gap-1">
        <i class="fa-solid fa-shield-halved text-base"></i>
        <span>公积金</span>
      </button>
      <button class="text-slate-500 hover:text-slate-300 flex flex-col items-center gap-1">
        <i class="fa-solid fa-chart-line text-base"></i>
        <span>股票</span>
      </button>
      <button class="text-slate-500 hover:text-slate-300 flex flex-col items-center gap-1">
        <i class="fa-solid fa-gear text-base"></i>
        <span>设置</span>
      </button>
    </footer>

  </div>

</body>
</html>
